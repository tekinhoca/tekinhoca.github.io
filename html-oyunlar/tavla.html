<script id="eng">
(function (root) {
  'use strict';

  const BAR = 'bar', OFF = 'off';

  function newState() {
    const pts = new Array(25).fill(0);
    pts[24] = 2; pts[13] = 5; pts[8] = 3; pts[6] = 5;
    pts[1] = -2; pts[12] = -5; pts[17] = -3; pts[19] = -5;
    return { pts: pts, bar: [0, 0], off: [0, 0] };
  }
  function clone(s) { return { pts: s.pts.slice(), bar: s.bar.slice(), off: s.off.slice() }; }
  function sg(p) { return p === 0 ? 1 : -1; }
  function ownAt(s, p, a) { return s.pts[a] * sg(p); }
  function dist(p, a) { return p === 0 ? a : 25 - a; }
  function key(s, p) { return s.pts.join(',') + '|' + s.bar[0] + s.bar[1] + '|' + s.off[0] + ',' + s.off[1] + '|' + p; }

  function allHome(s, p) {
    if (s.bar[p] > 0) return false;
    for (let a = 1; a <= 24; a++) if (ownAt(s, p, a) > 0 && dist(p, a) > 6) return false;
    return true;
  }

  function singleMoves(s, p, d) {
    const res = [], k = sg(p);
    if (s.bar[p] > 0) {
      const t = p === 0 ? 25 - d : d;
      const opp = -s.pts[t] * k;
      if (opp < 2) res.push({ from: BAR, to: t, die: d, hit: opp === 1 });
      return res;
    }
    const home = allHome(s, p);
    for (let a = 1; a <= 24; a++) {
      if (ownAt(s, p, a) <= 0) continue;
      const t = p === 0 ? a - d : a + d;
      if (t >= 1 && t <= 24) {
        const opp = -s.pts[t] * k;
        if (opp < 2) res.push({ from: a, to: t, die: d, hit: opp === 1 });
      } else if (home) {
        const da = dist(p, a);
        if (d === da) res.push({ from: a, to: OFF, die: d, hit: false });
        else if (d > da) {
          let higher = false;
          for (let b = 1; b <= 24; b++) if (ownAt(s, p, b) > 0 && dist(p, b) > da) { higher = true; break; }
          if (!higher) res.push({ from: a, to: OFF, die: d, hit: false });
        }
      }
    }
    return res;
  }

  function applyMove(s, p, m) {
    const n = clone(s), k = sg(p);
    if (m.from === BAR) n.bar[p]--; else n.pts[m.from] -= k;
    if (m.to === OFF) n.off[p]++;
    else {
      if (m.hit) { n.pts[m.to] = 0; n.bar[1 - p]++; }
      n.pts[m.to] += k;
    }
    return n;
  }

  function distinct(dice) { return Array.from(new Set(dice)); }
  function removeOne(dice, d) { const r = dice.slice(); r.splice(r.indexOf(d), 1); return r; }

  function bestLen(s, p, dice, memo) {
    if (!dice.length) return 0;
    const mk = key(s, p) + '#' + dice.slice().sort().join('');
    const c = memo.get(mk);
    if (c !== undefined) return c;
    let best = 0;
    const ds = distinct(dice);
    for (let i = 0; i < ds.length && best < dice.length; i++) {
      const d = ds[i], ms = singleMoves(s, p, d);
      if (!ms.length) continue;
      const rest = removeOne(dice, d);
      for (let j = 0; j < ms.length; j++) {
        const v = 1 + bestLen(applyMove(s, p, ms[j]), p, rest, memo);
        if (v > best) best = v;
        if (best === dice.length) break;
      }
    }
    memo.set(mk, best);
    return best;
  }

  function legalMoves(s, p, dice, memo) {
    memo = memo || new Map();
    const best = bestLen(s, p, dice, memo);
    if (best === 0) return [];
    const out = [], ds = distinct(dice);
    for (let i = 0; i < ds.length; i++) {
      const d = ds[i], rest = removeOne(dice, d), ms = singleMoves(s, p, d);
      for (let j = 0; j < ms.length; j++) {
        if (1 + bestLen(applyMove(s, p, ms[j]), p, rest, memo) === best) out.push(ms[j]);
      }
    }
    if (best === 1 && ds.length === 2) {
      const big = Math.max(ds[0], ds[1]);
      const bm = out.filter(function (m) { return m.die === big; });
      if (bm.length) return bm;
    }
    return out;
  }

  function diceFromRoll(r) { return r[0] === r[1] ? [r[0], r[0], r[0], r[0]] : [r[0], r[1]]; }
  function winner(s) { return s.off[0] === 15 ? 0 : s.off[1] === 15 ? 1 : -1; }
  function basePoints(s, w) { return s.off[1 - w] === 0 ? 2 : 1; }
  function pipCount(s, p) {
    let n = s.bar[p] * 25;
    for (let a = 1; a <= 24; a++) { const c = ownAt(s, p, a); if (c > 0) n += c * dist(p, a); }
    return n;
  }

  function secureRandInt(n) {
    const c = (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.getRandomValues) ? globalThis.crypto : null;
    if (!c) return Math.floor(Math.random() * n);
    const lim = 4294967296 - (4294967296 % n), a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  function rollDie(randInt) { return (randInt || secureRandInt)(6) + 1; }
  function rollTwo(randInt) { return [rollDie(randInt), rollDie(randInt)]; }
  function openingRoll(randInt) {
    let a, b;
    do { a = rollDie(randInt); b = rollDie(randInt); } while (a === b);
    return { dice: [a, b], starter: a > b ? 0 : 1 };
  }

  function newMatch(target) { return { target: target, score: [0, 0], game: 0 }; }
  function gamePoints(s, w) { return basePoints(s, w); }
  function recordGame(match, w, points) {
    match.score[w] += points; match.game++;
    const over = match.score[w] >= match.target;
    return { over: over, winner: over ? w : -1 };
  }

  const api = { BAR: BAR, OFF: OFF, newState: newState, clone: clone, singleMoves: singleMoves, applyMove: applyMove,
    legalMoves: legalMoves, bestLen: bestLen, diceFromRoll: diceFromRoll, winner: winner, basePoints: basePoints,
    gamePoints: gamePoints, pipCount: pipCount, rollDie: rollDie, rollTwo: rollTwo, openingRoll: openingRoll,
    secureRandInt: secureRandInt, newMatch: newMatch, recordGame: recordGame, allHome: allHome };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TavlaEngine = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script id="ai">
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : self;
  const E = (typeof module !== 'undefined' && module.exports && typeof require === 'function') ? require('./engine.js') : G.TavlaEngine;
  const rm = (a, d) => { a = a.slice(); a.splice(a.indexOf(d), 1); return a; };
  const sk = s => s.pts.join(',') + '|' + s.bar + '|' + s.off;
  const T = [0, .31, .33, .39, .42, .42, .47, .17, .15, .11, .06, .03, .03];

  function outcomes(s, p, dice, memo) {
    const res = new Map(), seen = new Set();

  '<div class="pg"><div class="pgt">Amaç ve taşların yönü</div><p>Her oyuncunun <b>15 taşı</b> vardır. Amaç, bütün taşlarını kendi evine (son 6 hane) getirip tahtadan ilk toplamaktır.</p><p>Beyazın evi altta, siyahın evi üsttedir. Taşlarınızı kendi evinize doğru ilerletirsiniz; toplama bölmesi evlerin yanındadır.</p></div>',
  '<div class="pg"><div class="pgt">Açılış ve sıra</div><p>İlk oyunda iki taraf birer zar atar. Büyük atan, zarları yeniden atarak başlar; eşitlikte açılış atışı tekrarlanır. Zarlar otomatik atılır.</p><p>Aynı parti içindeki sonraki oyunlarda önceki oyunun galibi başlar. Parti bittikten sonra tavla kapatılmadan yeni parti açılırsa son partinin galibi başlar; tavla kapatılıp yeniden açılırsa açılış atışı yapılır.</p></div>',
  '<div class="pg"><div class="pgt">Hamle ve kırma</div><p>Zar sayısı kadar ilerleyin. Taşa dokunun; gidebileceği haneler altın renkle parlar. Hedefe dokunarak hamleyi yapın. <b>Hamle geri alınamaz.</b></p><p>Rakibin iki veya daha fazla taşı bulunan haneye gidilemez. Tek rakip taşının üzerine gelirseniz taş kırılır ve orta çubuğa gider. Kırık taşınız varsa önce rakibin evinden oyuna sokmalısınız.</p></div>',
  '<div class="pg"><div class="pgt">Zar kuralları</div><p>İki zar da oynanabiliyorsa <b>ikisi de oynanmalıdır.</b> Çift zar attığınızda dört hamle yaparsınız.</p><p>Yalnız bir zar oynanabiliyorsa o zar kullanılır. İki zardan yalnız biri seçilebiliyorsa <b>büyük zar</b> oynanır. Oynanabilir hamle kalmadığında sıra otomatik geçer.</p></div>',
  '<div class="pg"><div class="pgt">Taş toplama ve puan</div><p>15 taşınızın tamamı kendi evinizdeyken taş toplamaya başlayabilirsiniz. Zarın gösterdiği hanede taş yoksa ve daha yüksek hanede de taş kalmamışsa en yüksek haneden taş alınabilir. Taş toplamak zorunlu değildir.</p><p>Normal galibiyet <b>1 puan</b>, mars (rakip hiç taş toplayamadan biterse) <b>2 puandır.</b> Parti, seçilen puana ilk ulaşan oyuncunun olur; mars ile hedef aşılabilir.</p></div>'
 ];
 const dots=pages.map((_,i)=>'<span'+(i===0?' class="on"':'')+'></span>').join('');
 modal('<div class="rules-layout"><div class="rules-head"><img class="m" src="../img/mecesml.webp" alt="Tekin Hoca" onerror="this.remove()"></div><div class="rules-pages"><div class="pgs">'+pages.join('')+'</div></div><div class="rules-footer"><div class="rnav"><button class="rarr" id="rP" aria-label="Önceki sayfa">&#8249;</button><div class="rdots">'+dots+'</div><button class="rarr" id="rN" aria-label="Sonraki sayfa">&#8250;</button></div><button class="go" id="cl">KAPAT</button></div></div>',true,'rules-card','Kurallar');
 rPage(0);
}
function end(w,fp){lw=w;phase='over';busy=false;hideSug();const g0=gid,pts=fp||E.gamePoints(S,w),r=E.recordGame(match,w,pts),n=nm();partyDone=r.over?{mode:mode,winner:w}:null;vib();score();
 const t=mode==='cpu'?(w===0?'Siz kazandınız':'Bilgisayar kazandı'):n[w]+' kazandı';
 modal('<div class="result"><div class="h">'+t+(pts===2?' — MARS!':'')+'</div><div class="points">+'+pts+' puan</div>'+(target>1?'<div class="matchscore">'+n[0]+' '+match.score[0]+' — '+match.score[1]+' '+n[1]+'</div>':'')+'</div>'+(r.over?'<p><b>Parti sona erdi.</b></p><button class="go" id="mn">YENİ PARTİ</button>':'<p>Sonraki oyunda ilk zarı, bu oyunun kazananı atacak.</p><button class="go" id="nx">SONRAKİ OYUN</button>'),false,'','Oyun sonucu');const bb=$('nx')||$('mn');if(bb){bb.disabled=true;setTimeout(()=>{if(bb.isConnected&&gid===g0)bb.disabled=false},800)}}
async function startGame(st,notice){killAI();cancelAnimation();const g=++gid;noteActive=false;statusText='';$('nt').classList.remove('on','rematch');hl=null;rolling=0;S=E.newState();hideSug();dice=[];last=[];sel=dests=froms=null;cur=0;busy=true;phase='open';openingNames=false;score();
 if(st!==undefined){cur=st;dd=[];if(notice){await rematchNotice(st);if(g!==gid)return}turnStart();return}
 const o=E.openingRoll();msg('Açılış atışı…');openingNames=true;dd=[{x:710,y:320,v:o.dice[0],p:0,u:false},{x:230,y:320,v:o.dice[1],p:1,u:false}];rolling=1;kick();await sleep(1500);if(g!==gid)return;rolling=0;kick();
 cur=o.starter;statusText=currentStatus();kick();await sleep(1100);if(g!==gid)return;openingNames=false;dd=[];turnStart()}
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');
 if(!b){if(e.target.id==='ov'&&canClose)closeM();return}
 if(b.dataset.m){pm=b.dataset.m;$('gl').hidden=pm!=='cpu';[...$('gm').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.dataset.l){pl=+b.dataset.l;[...$('gv').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.dataset.t){pt=+b.dataset.t;[...$('gt').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.id==='rP'){rPage(rp-1);return}if(b.id==='rN'){rPage(rp+1);return}
 if(b.id==='go'){const starter=partyDone&&partyDone.mode===pm?partyDone.winner:undefined;partyDone=null;mode=pm;level=pl;target=pt;match=E.newMatch(target);closeM();startGame(starter,starter!==undefined)}
 else if(b.id==='mn'){menu()}
 else if(b.id==='nx'){closeM();startGame(lw,false)}
 else if(b.id==='newYes'){menu()}else if(b.id==='newNo'){closeM()}
 else if(b.id==='acceptSuggestion'){const sg=pendingSuggestion;hideSug();closeM();if(sg)end(sg.winner,sg.points)}else if(b.id==='rejectSuggestion'){closeM()}else if(b.id==='cl'){closeM()}});
(function(){let x0=null;const c=$('card');c.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{if(x0===null||!$('rP'))return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>40)rPage(rp+(d<0?1:-1))},{passive:true})})();
const blurAct=()=>{const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur()};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(!$('ov').hidden){
  if(e.key==='Escape'){if(canClose){e.preventDefault();closeM()}return}
  if($('rP')){if(e.key==='ArrowLeft'){e.preventDefault();rPage(rp-1)}else if(e.key==='ArrowRight'){e.preventDefault();rPage(rp+1)}else if(e.key==='Enter'){e.preventDefault();$('cl').click()}}
  else if(e.key==='Enter'){const b=$('go')||$('nx')||$('mn');if(b&&!b.disabled){e.preventDefault();b.click()}}
  blurAct();return}
 if((e.key==='f'||e.key==='F')&&fsOK){e.preventDefault();fsToggle();blurAct()}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)setTimeout(()=>{if(b.isConnected&&document.activeElement===b)b.blur()},0)});
function newGameClick(){if(phase==='menu'||phase==='over'){menu();return}
 modal('<div class="h">Oyun sürüyor</div><p>Yeni oyun başlatılırsa mevcut oyun ve parti skoru kaybolacak.</p><div class="menu-actions"><button class="go wide" id="newYes">YENİ OYUN BAŞLAT</button><button class="go wide" id="newNo">OYUNA DÖN</button></div>',true,'warn-card','Uyarı')}
$('new').onclick=newGameClick;$('rules').onclick=rules;
const fsb=$('fs'),fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled),fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
let fsSym=false;
function renderFs(){const full=!!fsEl();fsb.innerHTML=fsSym?(full?'⤡':'⛶'):(full?'NORMAL<br class="lb"> EKRAN':'TAM<br class="lb"> EKRAN');fsb.setAttribute('aria-label',full?'Normal ekran':'Tam ekran');fsb.style.flex=fsSym?'0 0 44px':''}
function fitLogo(){const ft=$('ft'),sd=$('side');if(!ft)return;ft.style.display='';
 if(!matchMedia('(min-aspect-ratio:1/1) and (min-width:560px)').matches||getComputedStyle(ft).display==='none')return;
 const a=sd.firstElementChild.getBoundingClientRect(),b=ft.getBoundingClientRect(),r=sd.getBoundingClientRect();if(a.top<r.top+4||b.bottom>r.bottom-4)ft.style.display='none'}
function fitBtns(){const bs=[$('new'),fsb].filter(b=>!b.hidden),
  run=()=>{let f=16;const set=v=>bs.forEach(b=>b.style.fontSize=v+'px'),bad=()=>bs.some(b=>b.scrollWidth>b.clientWidth||b.scrollHeight>b.clientHeight);set(f);while(f>6&&bad()){f-=.5;set(f)}return f};
 if(fsOK){fsSym=false;renderFs()}
 let f=run();if(fsOK&&f<11){fsSym=true;renderFs();f=run()}
 fitLogo()}
function fsToggle(){try{const d=document,e=d.documentElement,r=fsEl()?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(e.requestFullscreen||e.webkitRequestFullscreen).call(e);if(r&&r.catch)r.catch(()=>{})}catch(x){}}
if(fsOK){fsb.hidden=false;fsb.onclick=fsToggle;document.addEventListener('fullscreenchange',fitBtns);document.addEventListener('webkitfullscreenchange',fitBtns)}
addEventListener('resize',fitBtns);fitBtns();
size();kick();menu();
})();
</script></body></html>
