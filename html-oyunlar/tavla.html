<script id="eng">
(function (root) {
  'use strict';

  const BAR = 'bar', OFF = 'off';

  function newState() {
    const pts = new Array(25).fill(0);
    pts[24] = 2; pts[13] = 5; pts[8] = 3; pts[6] = 5;
    pts[1] = -2; pts[12] = -5; pts[17] = -3; pts[19] = -5;
    return { pts: pts, bar: [0, 0], off: [0, 0] };
  }
  function clone(s) { return { pts: s.pts.slice(), bar: s.bar.slice(), off: s.off.slice() }; }
  function sg(p) { return p === 0 ? 1 : -1; }
  function ownAt(s, p, a) { return s.pts[a] * sg(p); }
  function dist(p, a) { return p === 0 ? a : 25 - a; }
  function key(s, p) { return s.pts.join(',') + '|' + s.bar[0] + s.bar[1] + '|' + s.off[0] + ',' + s.off[1] + '|' + p; }

  function allHome(s, p) {
    if (s.bar[p] > 0) return false;
    for (let a = 1; a <= 24; a++) if (ownAt(s, p, a) > 0 && dist(p, a) > 6) return false;
    return true;
  }

  function singleMoves(s, p, d) {
    const res = [], k = sg(p);
    if (s.bar[p] > 0) {
      const t = p === 0 ? 25 - d : d;
      const opp = -s.pts[t] * k;
      if (opp < 2) res.push({ from: BAR, to: t, die: d, hit: opp === 1 });
      return res;
    }
    const home = allHome(s, p);
    for (let a = 1; a <= 24; a++) {
      if (ownAt(s, p, a) <= 0) continue;
      const t = p === 0 ? a - d : a + d;
      if (t >= 1 && t <= 24) {
        const opp = -s.pts[t] * k;
        if (opp < 2) res.push({ from: a, to: t, die: d, hit: opp === 1 });
      } else if (home) {
        const da = dist(p, a);
        if (d === da) res.push({ from: a, to: OFF, die: d, hit: false });
        else if (d > da) {
          let higher = false;
          for (let b = 1; b <= 24; b++) if (ownAt(s, p, b) > 0 && dist(p, b) > da) { higher = true; break; }
          if (!higher) res.push({ from: a, to: OFF, die: d, hit: false });
        }
      }
    }
    return res;
  }

  function applyMove(s, p, m) {
    const n = clone(s), k = sg(p);
    if (m.from === BAR) n.bar[p]--; else n.pts[m.from] -= k;
    if (m.to === OFF) n.off[p]++;
    else {
      if (m.hit) { n.pts[m.to] = 0; n.bar[1 - p]++; }
      n.pts[m.to] += k;
    }
    return n;
  }

  function distinct(dice) { return Array.from(new Set(dice)); }
  function removeOne(dice, d) { const r = dice.slice(); r.splice(r.indexOf(d), 1); return r; }

  function bestLen(s, p, dice, memo) {
    if (!dice.length) return 0;
    const mk = key(s, p) + '#' + dice.slice().sort().join('');
    const c = memo.get(mk);
    if (c !== undefined) return c;
    let best = 0;
    const ds = distinct(dice);
    for (let i = 0; i < ds.length && best < dice.length; i++) {
      const d = ds[i], ms = singleMoves(s, p, d);
      if (!ms.length) continue;
      const rest = removeOne(dice, d);
      for (let j = 0; j < ms.length; j++) {
        const v = 1 + bestLen(applyMove(s, p, ms[j]), p, rest, memo);
        if (v > best) best = v;
        if (best === dice.length) break;
      }
    }
    memo.set(mk, best);
    return best;
  }

  function legalMoves(s, p, dice, memo) {
    memo = memo || new Map();
    const best = bestLen(s, p, dice, memo);
    if (best === 0) return [];
    const out = [], ds = distinct(dice);
    for (let i = 0; i < ds.length; i++) {
      const d = ds[i], rest = removeOne(dice, d), ms = singleMoves(s, p, d);
      for (let j = 0; j < ms.length; j++) {
        if (1 + bestLen(applyMove(s, p, ms[j]), p, rest, memo) === best) out.push(ms[j]);
      }
    }
    if (best === 1 && ds.length === 2) {
      const big = Math.max(ds[0], ds[1]);
      const bm = out.filter(function (m) { return m.die === big; });
      if (bm.length) return bm;
    }
    return out;
  }

  function diceFromRoll(r) { return r[0] === r[1] ? [r[0], r[0], r[0], r[0]] : [r[0], r[1]]; }
  function winner(s) { return s.off[0] === 15 ? 0 : s.off[1] === 15 ? 1 : -1; }
  function basePoints(s, w) { return s.off[1 - w] === 0 ? 2 : 1; }
  function pipCount(s, p) {
    let n = s.bar[p] * 25;
    for (let a = 1; a <= 24; a++) { const c = ownAt(s, p, a); if (c > 0) n += c * dist(p, a); }
    return n;
  }

  function secureRandInt(n) {
    const c = (typeof globalThis !== 'undefined' && globalThis.crypto && globalThis.crypto.getRandomValues) ? globalThis.crypto : null;
    if (!c) return Math.floor(Math.random() * n);
    const lim = 4294967296 - (4294967296 % n), a = new Uint32Array(1);
    do { c.getRandomValues(a); } while (a[0] >= lim);
    return a[0] % n;
  }
  function rollDie(randInt) { return (randInt || secureRandInt)(6) + 1; }
  function rollTwo(randInt) { return [rollDie(randInt), rollDie(randInt)]; }
  function openingRoll(randInt) {
    let a, b;
    do { a = rollDie(randInt); b = rollDie(randInt); } while (a === b);
    return { dice: [a, b], starter: a > b ? 0 : 1 };
  }

  function newMatch(target, opts) {
    return { target: target, score: [0, 0], game: 0, crawford: false, crawfordUsed: false,
             cubeEnabled: !!(opts && opts.cubeEnabled) };
  }
  function newCube() { return { value: 1, owner: null }; }
  function canDouble(match, cube, p) {
    return match.cubeEnabled && !match.crawford && match.target > 1 &&
      (cube.owner === null || cube.owner === p) && cube.value < 64;
  }
  function respondDouble(cube, doubler, take) {
    if (take) return { ended: false, cube: { value: cube.value * 2, owner: 1 - doubler } };
    return { ended: true, winner: doubler, points: cube.value, cube: cube };
  }
  function gamePoints(s, w, cube) { return basePoints(s, w) * (cube ? cube.value : 1); }
  function recordGame(match, w, points) {
    match.score[w] += points; match.game++;
    if (match.crawford) { match.crawfordUsed = true; match.crawford = false; }
    const over = match.score[w] >= match.target;
    if (!over && !match.crawfordUsed && Math.max(match.score[0], match.score[1]) === match.target - 1) match.crawford = true;
    return { over: over, winner: over ? w : -1 };
  }

  const api = { BAR: BAR, OFF: OFF, newState: newState, clone: clone, singleMoves: singleMoves, applyMove: applyMove,
    legalMoves: legalMoves, bestLen: bestLen, diceFromRoll: diceFromRoll, winner: winner, basePoints: basePoints,
    gamePoints: gamePoints, pipCount: pipCount, rollDie: rollDie, rollTwo: rollTwo, openingRoll: openingRoll,
    secureRandInt: secureRandInt, newMatch: newMatch, newCube: newCube, canDouble: canDouble,
    respondDouble: respondDouble, recordGame: recordGame, allHome: allHome };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.TavlaEngine = api;
})(typeof window !== 'undefined' ? window : this);
</script>
<script id="ai">
(function () {
  'use strict';
  const G = typeof globalThis !== 'undefined' ? globalThis : self;
  const E = (typeof module !== 'undefined' && module.exports && typeof require === 'function') ? require('./engine.js') : G.TavlaEngine;
  const rm = (a, d) => { a = a.slice(); a.splice(a.indexOf(d), 1); return a; };
  const sk = s => s.pts.join(',') + '|' + s.bar + '|' + s.off;
  const T = [0, .31, .33, .39, .42, .42, .47, .17, .15, .11, .06, .03, .03];

  function outcomes(s, p, dice, memo) {
    const res = new Map(), seen = new Set();
    (function rec(st, ds, mv) {
      const ms = E.legalMoves(st, p, ds, memo);
      if (!ms.length) { const k = sk(st); if (!res.has(k)) res.set(k, { s: st, mv: mv }); return; }
      for (const m of ms) {
        const n = E.applyMove(st, p, m), d2 = rm(ds, m.die), k = sk(n) + '#' + d2.join('');
        if (seen.has(k)) continue; seen.add(k); rec(n, d2, mv.concat([m]));
      }
    })(s, dice, []);
    return res;
  }
  function contact(s) {
    let w = s.bar[0] ? 25 : 0, b = s.bar[1] ? 0 : 25;
    for (let a = 1; a <= 24; a++) { if (s.pts[a] > 0 && a > w) w = a; if (s.pts[a] < 0 && a < b) b = a; }
    return w > b;
  }
  const RB = [0, 0, 3, 8, 15, 25, 40], BW = [0, .75, .9, 1.2, 1.65, 2.25, 3];
  function feat(s, p, wt, sm) {
    const q = 1 - p, k = p ? -1 : 1, opp = [], od = [], made = [];
    for (let a = 1; a <= 24; a++) { const c = -s.pts[a] * k; for (let i = 0; i < c; i++) { opp.push(a); od.push(p ? 25 - a : a); } }
    for (let i = 0; i < s.bar[q]; i++) { opp.push(q ? 0 : 25); od.push(0); }
    let f = 0, run = 0, rs = 0;
    const flush = () => { if (run >= 2) { const T = od.filter(x => x < rs).length; f += RB[Math.min(run, 6)] * (T >= 2 ? 1 : T === 1 ? .7 : .3); } run = 0; };
    for (let d = 1; d <= 24; d++) {
      const a = p ? 25 - d : d, c = s.pts[a] * k;
      if (c >= 2) { f += d <= 6 ? 4 : d <= 12 ? 2.5 : d <= 18 ? 1.5 : 3; made[d] = true; if (!run) rs = d; run++; } else flush();
      if (c >= 5) f -= (c - 4) * 2.5;
      if (c > 2 && d <= 3) f -= (c - 2) * (d <= 2 ? 2 : 1);
      if (c === 1) {
        let nh = 1;
        for (let i = 0; i < opp.length; i++) { const g = q ? a - opp[i] : opp[i] - a; if (g >= 1 && g <= 12) nh *= 1 - T[g]; }
        f -= wt * (1 - nh) * (25 - d + 8);
      }
    }
    flush();
    if (sm) for (const x of od) { if (x > 12) continue; for (let kk = 1; kk <= 6; kk++) { const t = x + kk; if (t <= 24 && made[t]) f += BW[kk]; } }
    return f - s.bar[p] * 8;
  }
  function outH(s, p) {
    let h = s.bar[p] * 19;
    for (let a = 1; a <= 24; a++) { const c = s.pts[a] * (p ? -1 : 1); if (c > 0) { const d = p ? 25 - a : a; if (d > 6) h += c * (d - 6); } }
    return h;
  }
  function ev(s, p, tm, sm) {
    const q = 1 - p;
    let v = E.pipCount(s, q) - E.pipCount(s, p) + 3 * (s.off[p] - s.off[q]);
    if (sm) {
      if (s.off[q] > 0) v += s.off[p] > 0 ? 1000 : -1000;
      if (s.off[p] === 0 && s.off[q] > 0) v -= 3 * outH(s, p);
      if (s.off[q] === 0 && s.off[p] > 0) v += 3 * outH(s, q);
    }
    if (!contact(s)) return v;
    return v + feat(s, p, p === tm ? .5 : 1, sm) - feat(s, q, q === tm ? .5 : 1, sm);
  }
  const ROLLS = []; for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) ROLLS.push([[a, b], a === b ? 1 : 2]);

  const BOOK = {
    '12': [[[13, 11], [24, 23]], [[13, 11], [6, 5]]], '13': [[[8, 5], [6, 5]]], '14': [[[24, 23], [13, 9]]],
    '15': [[[24, 23], [13, 8]], [[13, 8], [6, 5]]], '16': [[[13, 7], [8, 7]]], '23': [[[24, 21], [13, 11]]],
    '24': [[[8, 4], [6, 4]]], '25': [[[24, 22], [13, 8]]], '26': [[[24, 18], [13, 11]]],
    '34': [[[13, 10], [13, 9]], [[24, 21], [13, 9]]], '35': [[[8, 3], [6, 3]]], '36': [[[24, 18], [13, 10]]],
    '45': [[[24, 20], [13, 8]]], '46': [[[8, 2], [6, 2]], [[24, 18], [18, 14]]], '56': [[[24, 18], [18, 13]]],
    '11': [[[8, 7], [8, 7], [6, 5], [6, 5]]], '22': [[[13, 11], [13, 11], [6, 4], [6, 4]]], '33': [[[8, 5], [8, 5], [6, 3], [6, 3]]],
    '44': [[[24, 20], [24, 20], [13, 9], [13, 9]]], '55': [[[13, 8], [13, 8], [8, 3], [8, 3]]], '66': [[[24, 18], [24, 18], [13, 7], [13, 7]]]
  };
  function book(s, p, roll) {
    if (sk(s) !== sk(E.newState())) return null;
    const alts = BOOK[Math.min(roll[0], roll[1]) + '' + Math.max(roll[0], roll[1])];
    if (!alts) return null;
    const steps = alts[Math.floor(Math.random() * alts.length)], ab = x => p ? 25 - x : x;
    let st = s, dice = E.diceFromRoll(roll); const out = [];
    for (const [f, t] of steps) {
      const m = { from: ab(f), to: ab(t), die: f - t, hit: false };
      if (!E.legalMoves(st, p, dice).some(x => x.from === m.from && x.to === m.to && x.die === m.die)) return null;
      out.push(m); st = E.applyMove(st, p, m); dice = rm(dice, m.die);
    }
    return E.legalMoves(st, p, dice).length ? null : out;
  }

  function plan(s, p, roll, lv, ms) {
    const bk = book(s, p, roll); if (bk) return bk;
    const memo = new Map(), outs = Array.from(outcomes(s, p, E.diceFromRoll(roll), memo).values());
    if (!outs.length) return [];
    const q = 1 - p;
    const c = outs.map(o => ({ o: o, v: (E.winner(o.s) === p ? 1e6 : ev(o.s, p, q, lv > 1)) + Math.random() * .4 }));
    c.sort((x, y) => y.v - x.v);
    if (lv < 2 || c.length === 1 || c[0].v > 5e5) return c[0].o.mv;
    const dl = Date.now() + (ms || 2800);
    let best = c[0].o.mv, bv = -Infinity;
    for (const x of c.slice(0, 24)) {
      let tot = 0, ok = true;
      for (const [r, wt] of ROLLS) {
        if (Date.now() > dl) { ok = false; break; }
        const os = outcomes(x.o.s, q, E.diceFromRoll(r), memo);
        let w = Infinity;
        for (const y of os.values()) { const v = E.winner(y.s) === q ? -1e5 : ev(y.s, p, p, true); if (v < w) w = v; }
        if (w === Infinity) w = ev(x.o.s, p, p, true);
        tot += wt * w;
      }
      if (!ok) break;
      tot /= 36;
      if (tot > bv) { bv = tot; best = x.o.mv; }

function paths(f){const mp=new Map();(function rec(st,ds,pf,ch){E.legalMoves(st,cur,ds).filter(m=>m.from===pf).sort((a,b)=>a.die-b.die).forEach(m=>{const c=ch.concat(m);if(!mp.has(m.to)||better(c,mp.get(m.to)))mp.set(m.to,c);if(m.to!=='off')rec(E.applyMove(st,cur,m),rm(ds,m.die),m.to,c)})})(S,dice,f,[]);return mp}
async function play(path){const g=gid,p=cur;busy=true;froms=null;sel=null;dests=null;last=[];
 for(const m of path){await fly(m);if(g!==gid)return;use(m.die);last.push({...m,p});if(m.hit)vib()}
 if(g!==gid)return;busy=false;after()}
function hit(x,y){if(x>=925)return'off';if(x>=440&&x<=500)return'bar';const c=x<440?Math.floor((x-20)/70):6+Math.floor((x-500)/70);if(c<0||c>11)return null;return y<LH/2?c+13:12-c}
cv.addEventListener('pointerdown',e=>{if(phase!=='move'||busy||isCpu())return;
 const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let x,y;
 if(r.height>r.width){const s=r.width/LH;x=py/s;y=(r.width-px)/s}else{const s=r.width/LW;x=px/s;y=py/s}
 const h=hit(x,y);if(h===null)return;
 if(sel===h){sel=null;dests=null;kick();return}
 if(sel!==null&&dests&&dests.has(h)){play(dests.get(h));return}
 if(froms&&froms.has(h)){sel=h;dests=paths(h)}else{sel=null;dests=null}
 kick()});
function modal(html,cl,cls){canClose=!!cl;const card=$('card');card.className=cls||'';card.innerHTML=html;$('ov').hidden=false}
function closeM(){$('ov').hidden=true;canClose=false}
function menu(){pm=mode;pl=level;pt=target;modal('<div class="h">TAVLA</div><p>Oyun türü</p><div class="seg" id="gm"><button data-m="cpu"'+(pm==='cpu'?' class="on"':'')+'>Bilgisayara karşı</button><button data-m="two"'+(pm==='two'?' class="on"':'')+'>İki kişilik</button></div><div id="gl"'+(pm==='cpu'?'':' hidden')+'><p>Seviye</p><div class="seg" id="gv">'+['Kolay','Orta','Zor'].map((x,i)=>'<button data-l="'+i+'"'+(pl===i?' class="on"':'')+'>'+x+'</button>').join('')+'</div></div><p>Parti</p><div class="seg" id="gt">'+[1,3,5].map(t=>'<button data-t="'+t+'"'+(pt===t?' class="on"':'')+'>'+(t===1?'Tek oyun':t+"\'te biter")+'</button>').join('')+'</div><button class="go" id="go">BAŞLA</button>'+(phase!=='menu'&&phase!=='over'?'<button class="go" id="cl">VAZGEÇ</button>':''))}
let rp=0,pm='cpu',pl=1,pt=1;
function rPage(i){const p=[...document.querySelectorAll('#card .pg')];rp=Math.max(0,Math.min(p.length-1,i));p.forEach((x,k)=>x.classList.toggle('on',k===rp));document.querySelectorAll('#card .rdots span').forEach((x,k)=>x.classList.toggle('on',k===rp));$('rP').disabled=rp===0;$('rN').disabled=rp===p.length-1}
function rules(){modal('<img src="../img/mecesml.webp" alt="Tavla" onerror="this.remove()"><div class="pgs"><div class="pg"><div class="pgt">Amaç ve açılış</div><p><b>Amaç:</b> 15 taşınızı önce eve (son 6 hane) getirip tahtadan toplamak. Beyazın evi altta, siyahın evi üsttedir; toplama bölmesi evlerin yanındadır.</p><p><b>Açılış:</b> İlk oyunda iki taraf birer zar atar. Büyük atan oyuncu zarları yeniden atarak başlar; eşitlikte açılış atışı tekrarlanır. Aynı parti içindeki sonraki oyunlarda son oyunu kazanan oyuncu ilk zarı atar. Zarlar otomatik atılır.</p></div><div class="pg"><div class="pgt">Hamle ve kırma</div><p>Zar sayısı kadar hane ilerlenir. Taşa dokunun, gidebileceği yerler altın parlar; hedefe dokunun. Oynanan hamle geri alınamaz.</p><p>Rakibin <b>2 veya daha fazla</b> taşı olan haneye gidilemez. <b>Tek taşın</b> üzerine basarsanız o taş kırılır ve orta çubuğa gider (kırma hamlesi turuncu gösterilir).</p><p>Kırık taşınız varsa önce onu rakibin evine sokmalısınız.</p></div><div class="pg"><div class="pgt">Zar kuralları</div><p>İki zar da oynanabiliyorsa ikisi de oynanmalıdır. Çift atarsanız dört kez oynarsınız.</p><p>Yalnız biri oynanabiliyorsa o oynanır; ikisinden biri seçilebiliyorsa <b>büyük zar</b> oynanır.</p><p>Oynanacak hamle kalmadığında sıra otomatik geçer.</p></div><div class="pg"><div class="pgt">Toplama ve puan</div><p>Tüm taşlarınız evdeyken toplayabilirsiniz. Zarın hanesinde taş yoksa ve daha yüksek hanede de taş kalmadıysa en yüksek haneden toplanır. Toplamak zorunlu değildir.</p><p><b>Puan:</b> Normal galibiyet 1, <b>mars</b> (rakip hiç taş toplayamadan biterse) 2 puandır. Parti, seçilen puana ilk ulaşanındır; mars ile hedef aşılabilir.</p></div></div><div class="rnav"><button class="rarr" id="rP" aria-label="Önceki sayfa">&#8249;</button><div class="rdots"><span class="on"></span><span></span><span></span><span></span></div><button class="rarr" id="rN" aria-label="Sonraki sayfa">&#8250;</button></div><button class="go" id="cl">KAPAT</button>',true,'rules-card');rPage(0)}
function end(w){lw=w;phase='over';busy=false;const pts=E.gamePoints(S,w,null),r=E.recordGame(match,w,pts),n=nm();vib();score();
 const t=mode==='cpu'?(w===0?'Siz kazandınız':'Bilgisayar kazandı'):n[w]+' kazandı';
 modal('<div class="result"><div class="h">'+t+(pts===2?' — MARS!':'')+'</div><div class="points">+'+pts+' puan</div>'+(target>1?'<div class="matchscore">'+n[0]+' '+match.score[0]+' — '+match.score[1]+' '+n[1]+'</div>':'')+'</div>'+(r.over?'<p><b>Parti sona erdi.</b></p><button class="go" id="mn">YENİ PARTİ</button>':'<p>Sonraki oyunda ilk zarı kazanan oyuncu atacak.</p><button class="go" id="nx">SONRAKİ OYUN</button>'))}
async function startGame(st){cancelAnimation();const g=++gid;hl=null;rolling=0;S=E.newState();dice=[];last=[];sel=dests=froms=null;cur=0;busy=true;phase='open';openingNames=false;score();
 if(st!==undefined){cur=st;dd=[];msg(currentStatus());await sleep(650);if(g!==gid)return;turnStart();return}
 const o=E.openingRoll();msg('Açılış atışı…');openingNames=true;dd=[{x:710,y:320,v:o.dice[0],p:0,u:false},{x:230,y:320,v:o.dice[1],p:1,u:false}];rolling=1;kick();await sleep(1500);if(g!==gid)return;rolling=0;kick();
 cur=o.starter;statusText=currentStatus();kick();await sleep(1100);if(g!==gid)return;openingNames=false;dd=[];turnStart()}
$('ov').addEventListener('click',e=>{const b=e.target.closest('button');
 if(!b){if(e.target.id==='ov'&&canClose)closeM();return}
 if(b.dataset.m){pm=b.dataset.m;$('gl').hidden=pm!=='cpu';[...$('gm').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.dataset.l){pl=+b.dataset.l;[...$('gv').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.dataset.t){pt=+b.dataset.t;[...$('gt').children].forEach(x=>x.classList.toggle('on',x===b));return}
 if(b.id==='rP'){rPage(rp-1);return}if(b.id==='rN'){rPage(rp+1);return}
 if(b.id==='go'){mode=pm;level=pl;target=pt;match=E.newMatch(target);closeM();startGame()}
 else if(b.id==='mn'){menu()}
 else if(b.id==='nx'){closeM();startGame(lw)}
 else if(b.id==='cl'){closeM()}});
(function(){let x0=null;const c=$('card');c.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});c.addEventListener('touchend',e=>{if(x0===null||!$('rP'))return;const d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>40)rPage(rp+(d<0?1:-1))},{passive:true})})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&canClose)closeM()});
$('new').onclick=menu;$('rules').onclick=rules;
const fsb=$('fs'),fsOK=!!(document.fullscreenEnabled&&document.documentElement.requestFullscreen);
function fitBtns(){const bs=[$('new'),fsb].filter(b=>!b.hidden);let f=16;const set=v=>bs.forEach(b=>b.style.fontSize=v+'px'),bad=()=>bs.some(b=>b.scrollWidth>b.clientWidth||b.scrollHeight>b.clientHeight);set(f);while(f>6&&bad()){f-=.5;set(f)}}
function fsLabel(){fsb.innerHTML=document.fullscreenElement?'NORMAL<br class="lb"> EKRAN':'TAM<br class="lb"> EKRAN';fitBtns()}
if(fsOK){fsb.hidden=false;fsb.onclick=()=>{try{const r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}};document.addEventListener('fullscreenchange',fsLabel)}
addEventListener('resize',fitBtns);fitBtns();
size();kick();menu();
})();
</script></body></html>
