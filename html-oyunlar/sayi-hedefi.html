<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Sayı Hedefi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100dvh;background:#0e0c08;font-family:Georgia,serif;display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow-y:auto;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;gap:10px;margin:0 auto;padding:4px 0 20px}

/* ── EKRANLAR ── */
.screen{display:none;flex-direction:column;gap:12px;animation:fadeIn .35s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── BAŞLIK ── */
.game-title{font-size:18px;font-weight:700;color:#c8960c;letter-spacing:.08em;text-align:center}
.subtitle{font-size:11px;color:rgba(247,242,232,0.35);text-align:center;letter-spacing:.05em}

/* ── MOD SEÇİMİ ── */
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{background:rgba(200,150,12,0.08);border:1px solid rgba(200,150,12,0.35);border-radius:6px;padding:18px 10px;cursor:pointer;color:rgba(247,242,232,0.7);font-family:Georgia,serif;font-size:13px;transition:all .2s;text-align:center;min-width:0}
@media(hover:hover){.mode-btn:hover{background:rgba(200,150,12,0.2);color:#e8d5a0;border-color:rgba(200,150,12,0.6)}}
.mode-btn .mode-icon{font-size:26px;display:block;margin-bottom:6px}
.mode-btn .mode-label{font-weight:700;display:block;margin-bottom:3px}
.mode-btn .mode-desc{font-size:10px;color:rgba(247,242,232,0.4);display:block}

/* ── İSİM GİRİŞİ ── */
.name-form{display:flex;flex-direction:column;gap:10px}
.name-row{display:flex;flex-direction:column;gap:4px}
.name-row label{font-size:10px;color:rgba(247,242,232,0.4);text-transform:uppercase;letter-spacing:.08em}
.name-row input{background:#16140e;border:1px solid rgba(200,150,12,0.3);border-radius:4px;padding:8px 12px;color:#e8d5a0;font-family:Georgia,serif;font-size:14px;outline:none;transition:border-color .2s}
.name-row input:focus{border-color:rgba(200,150,12,0.7)}
.name-row input::placeholder{color:rgba(247,242,232,0.2)}

/* ── BUTONLAR ── */
button.a{background:rgba(200,150,12,0.08);border:1px solid rgba(200,150,12,0.3);border-radius:4px;padding:7px 16px;font-size:11px;cursor:pointer;color:rgba(247,242,232,0.7);font-family:Georgia,serif;transition:background .2s}
@media(hover:hover){button.a:hover{background:rgba(200,150,12,0.22)}}
button.primary{background:rgba(200,150,12,0.2);border:1px solid rgba(200,150,12,0.6);border-radius:4px;padding:10px 24px;font-size:13px;cursor:pointer;color:#e8d5a0;font-family:Georgia,serif;font-weight:700;transition:all .2s;letter-spacing:.04em}
@media(hover:hover){button.primary:hover{background:rgba(200,150,12,0.35)}}
/* ── ÜSTTBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.infobar{display:flex;gap:6px}
.ibox{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:5px;padding:5px 8px;flex:1;text-align:center}
.ibox .l{font-size:9px;color:rgba(247,242,232,0.3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1px}
.ibox .v{font-size:14px;font-weight:700;color:#c8960c}

/* ── SKOR TABLOSU ── */
.scorebar{display:flex;gap:6px}
.sbox{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:5px;padding:6px 10px;flex:1;text-align:center;transition:all .3s}
.sbox.active-player{background:rgba(200,150,12,0.12);border-color:rgba(200,150,12,0.4)}
.sbox .sname{font-size:10px;color:rgba(247,242,232,0.5);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .sscore{font-size:18px;font-weight:700;color:#c8960c}

/* ── HEDEF ── */
.target-wrap{text-align:center;padding:14px 0 8px}
.target-label{font-size:10px;color:rgba(247,242,232,0.35);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.target-num{font-size:52px;font-weight:700;color:#e8d5a0;letter-spacing:.04em;line-height:1;text-shadow:0 0 30px rgba(200,150,12,0.3)}

/* ── SÜRE ── */
.timer-wrap{display:flex;align-items:center;gap:8px}
.timer-bar-bg{flex:1;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.timer-bar{height:100%;background:#c8960c;border-radius:3px;transition:width .5s linear,background .5s}
.timer-num{font-size:13px;font-weight:700;color:#c8960c;min-width:28px;text-align:right}

/* ── KARTLAR ── */
.cards-area{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.card{
  width:68px;height:68px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#e8d5a0;
  background:linear-gradient(135deg,#1e1c14,#16140c);
  border:1.5px solid rgba(200,150,12,0.4);border-radius:6px;
  cursor:pointer;transition:all .15s;user-select:none;
  box-shadow:2px 3px 8px rgba(0,0,0,0.4);
  position:relative;
}
@media(hover:hover){.card:hover:not(.used):not(.selected){background:linear-gradient(135deg,#2a2618,#1e1c12);border-color:rgba(200,150,12,0.7)}}
.card.selected{background:linear-gradient(135deg,#2a2210,#1e1808);border-color:#c8960c;border-width:2px;box-shadow:0 0 12px rgba(200,150,12,0.4)}
.card.used{opacity:.22;cursor:default;filter:grayscale(60%)}
.card.result-card{background:linear-gradient(135deg,#1a2818,#121e10);border-color:rgba(80,200,120,0.5);color:#50c878}
.card.big-num{font-size:18px}

/* ── İŞLEMLER ── */
.ops-area{display:flex;gap:8px;justify-content:center}
.op-btn{
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:rgba(247,242,232,0.6);
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);
  border-radius:6px;cursor:pointer;transition:all .15s;user-select:none;
}
@media(hover:hover){.op-btn:hover:not(.op-selected){background:rgba(255,255,255,0.1);color:#e8d5a0}}
.op-btn.op-selected{background:rgba(200,150,12,0.2);border-color:#c8960c;color:#c8960c}

/* ── HESAP GEÇMİŞİ ── */
.history-wrap{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.06);border-radius:5px;padding:8px 12px;min-height:48px}
.history-title{font-size:9px;color:rgba(247,242,232,0.25);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.history-list{display:flex;flex-direction:column;gap:3px}
.history-item{font-size:12px;color:rgba(247,242,232,0.5);font-family:Georgia,serif}
.history-item span{color:#c8960c}

/* ── MESAJ ── */
.msg{font-size:11px;color:rgba(247,242,232,0.4);text-align:center;min-height:15px}
.msg.warn{color:#e74c3c}
.msg.good{color:#50c878}

/* ── SONUÇ BANDI ── */
.result-banner{display:none;border-radius:5px;padding:10px 14px;text-align:center}
.result-banner.show{display:block}
.result-banner.exact{background:rgba(80,200,120,0.1);border:1px solid rgba(80,200,120,0.4)}
.result-banner.close{background:rgba(200,150,12,0.08);border:1px solid rgba(200,150,12,0.35)}
.result-banner.miss{background:rgba(100,80,30,0.1);border:1px solid rgba(150,100,30,0.25)}
.result-banner h2{font-size:14px;margin-bottom:3px}
.result-banner.exact h2{color:#50c878}
.result-banner.close h2{color:#c8960c}
.result-banner.miss h2{color:rgba(247,242,232,0.4)}
.result-banner p{font-size:11px;color:rgba(247,242,232,0.45)}

/* ── OYUN SONU ── */
.final-scores{display:flex;flex-direction:column;gap:8px}
.final-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:5px;padding:10px 14px}
.final-row.winner{background:rgba(200,150,12,0.1);border-color:rgba(200,150,12,0.4)}
.final-name{font-size:13px;color:#e8d5a0;font-weight:700}
.final-score{font-size:20px;font-weight:700;color:#c8960c}
.final-detail{font-size:10px;color:rgba(247,242,232,0.35);margin-top:2px}
.br-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* ── OYUNCU GEÇİŞ EKRANI ── */
.handoff{text-align:center;padding:20px 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.handoff-name{font-size:22px;font-weight:700;color:#c8960c}
.handoff-msg{font-size:13px;color:rgba(247,242,232,0.5)}

/* ── YENİ GÖRÜNÜM ── */
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(200,150,12,.17),transparent 70%),radial-gradient(35% 30% at 85% 30%,rgba(120,85,210,.15),transparent 70%),radial-gradient(40% 35% at 50% 95%,rgba(40,170,190,.13),transparent 70%);animation:drift 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#ffd96699,transparent),radial-gradient(1px 1px at 120px 80px,#ffffff88,transparent),radial-gradient(1.5px 1.5px at 70px 160px,#4dd0e199,transparent);background-size:200px 200px;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
@keyframes twinkle{from{opacity:.25}to{opacity:.75}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{text-shadow:0 0 18px rgba(200,150,12,.35)}to{text-shadow:0 0 38px rgba(255,217,102,.7)}}
@keyframes selPulse{0%,100%{box-shadow:0 0 10px rgba(200,150,12,.4)}50%{box-shadow:0 0 22px rgba(255,217,102,.75)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 rgba(255,217,102,0)}50%{box-shadow:0 0 22px rgba(255,217,102,.55)}}
@keyframes lowPulse{50%{opacity:.55}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{transform:translateY(-110px);opacity:0}}
.wrap{padding-bottom:70px}
.game-title{font-size:28px;background:linear-gradient(90deg,#c8960c,#ffe9a8,#c8960c);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
.subtitle{font-size:12px;color:rgba(247,242,232,.55)}
.mode-btn{--c:200,150,12;background:linear-gradient(160deg,rgba(var(--c),.18),rgba(var(--c),.04));border-color:rgba(var(--c),.55);padding:22px 10px;color:rgba(247,242,232,.88);transition:transform .15s,box-shadow .2s}
.mode-btn:nth-child(1){--c:77,208,225}.mode-btn:nth-child(2){--c:255,200,60}.mode-btn:nth-child(3){--c:179,136,255}.mode-btn:nth-child(4){--c:255,107,107}
.mode-btn:active{transform:scale(.96)}
@media(hover:hover){.mode-btn:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(var(--c),.3)}}
.mode-btn .mode-icon{font-size:30px;filter:drop-shadow(0 0 8px rgba(var(--c),.7))}
.mode-btn .mode-desc{font-size:11px;color:rgba(247,242,232,.6)}
#gameInfo{font-size:13px!important;color:rgba(247,242,232,.65)!important}
.timer-bar-bg{height:8px}.timer-bar.low{animation:lowPulse .8s infinite}.timer-num{font-size:20px;min-width:34px}
.sbox:nth-child(2).active-player{background:rgba(77,208,225,.12);border-color:rgba(77,208,225,.5)}.sbox:nth-child(2) .sscore{color:#4dd0e1}
.sbox .sname{font-size:12px}.sbox .sscore{font-size:22px}
.target-label{font-size:12px;color:rgba(247,242,232,.55)}
.target-num{font-size:clamp(56px,18vw,72px);color:#ffe9a8;animation:glow 3s ease-in-out infinite alternate}
.target-num.pop{animation:pop .5s cubic-bezier(.2,1.5,.4,1),glow 3s ease-in-out .5s infinite alternate}
.cards-area{max-width:330px;margin:0 auto;gap:10px}
.card{width:clamp(76px,24vw,92px);height:clamp(76px,24vw,92px);font-size:28px;border-radius:10px;background:linear-gradient(145deg,#2c2512,#17140b);box-shadow:inset 0 1px 0 rgba(255,233,168,.18),2px 4px 10px rgba(0,0,0,.5)}
.card:active{transform:scale(.95)}.card.big-num{font-size:24px}
.card.selected{animation:selPulse 1.3s ease-in-out infinite}
.card.result-card{background:linear-gradient(145deg,#1d3a22,#102016);box-shadow:0 0 14px rgba(80,200,120,.35)}
.card.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.ops-area{gap:10px}
.op-btn{--c:200,150,12;width:clamp(56px,16vw,66px);height:clamp(56px,16vw,66px);font-size:30px;color:rgb(var(--c));border-color:rgba(var(--c),.45);background:rgba(var(--c),.08)}
.op-btn[data-op="+"]{--c:61,220,151}.op-btn[data-op="-"]{--c:255,107,107}.op-btn[data-op="*"]{--c:179,136,255}.op-btn[data-op="/"]{--c:77,208,225}
.op-btn:active{transform:scale(.93)}
.op-btn.op-selected{background:rgba(var(--c),.28);border-color:rgb(var(--c));color:#fff;box-shadow:0 0 16px rgba(var(--c),.6);transform:scale(1.06)}
.history-wrap{padding:10px 14px}.history-title{font-size:12px;color:rgba(247,242,232,.5)}
.history-item{font-size:18px;line-height:1.55;color:rgba(247,242,232,.8)}.history-item span{font-weight:700}
.msg{font-size:14px;min-height:20px;color:rgba(247,242,232,.7)}
.result-banner{padding:14px 16px}.result-banner.show{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.result-banner h2{font-size:20px}.result-banner p{font-size:14px;color:rgba(247,242,232,.7)}
.result-banner.exact{box-shadow:0 0 24px rgba(80,200,120,.35)}.result-banner.close{box-shadow:0 0 16px rgba(200,150,12,.2)}
button.primary{background:linear-gradient(135deg,rgba(200,150,12,.38),rgba(255,217,102,.18))}
button.primary:active{transform:scale(.97)}button.primary:disabled{opacity:.35;cursor:default}
button.primary.big{font-size:20px;padding:16px 40px;min-width:min(86%,300px)}
button.primary.pulse{animation:btnPulse 1.8s ease-in-out infinite}
button.a{font-size:13px;padding:10px 18px}
#nextArea{display:none}#nextArea .primary{width:100%}
.handoff{padding:28px 0;gap:18px}
.handoff-tag{font-size:14px;color:rgba(247,242,232,.65)}
.handoff-name{font-size:clamp(36px,12vw,52px);line-height:1.1;word-break:break-word}
.handoff-name.p0{color:#ffd966;text-shadow:0 0 28px rgba(255,200,60,.55)}
.handoff-name.p1{color:#4dd0e1;text-shadow:0 0 28px rgba(77,208,225,.55)}
.handoff-score{font-size:14px;color:rgba(247,242,232,.55)}
.handoff-msg{font-size:18px;line-height:1.5;color:rgba(247,242,232,.88)}.handoff-msg b{color:#ffd966}
#fx{position:fixed;left:50%;top:38%;width:0;height:0;pointer-events:none;z-index:998}
#fx i{position:absolute;width:8px;height:8px;border-radius:2px;animation:burst 1.3s ease-out forwards}
#fx b{position:absolute;left:-50px;top:-20px;width:100px;text-align:center;font-size:36px;color:#ffd966;text-shadow:0 0 14px #c8960c;animation:floatUp 1.4s ease-out forwards}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ── EKRANA SIĞDIRMA (dvh tabanlı) ── */
html,body{height:100%}
body{height:100vh;height:100dvh;min-height:0;overflow:hidden;align-items:stretch;padding:max(8px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}
.wrap{height:100%;min-height:0;padding:0;gap:min(8px,1dvh)}
.screen{gap:min(10px,1.3dvh);overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{flex:1 1 auto;min-height:0}
#scMode.active,#scNames.active,#scHandoff.active,#scEnd.active{justify-content:center}
.handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.final-scores{flex:0 1 auto;min-height:0;overflow-y:auto}
#scGame>*{flex:none}
#scGame>.history-wrap{flex:0 1 auto;min-height:0;overflow-y:auto}
#scGame>.br-btns{margin-top:auto}
#scGame:has(.result-banner.show) .msg{display:none}
.foot{flex:none;display:flex;justify-content:center;height:min(34px,5dvh);opacity:.45;pointer-events:none}
.foot img{height:100%;width:auto}
.target-wrap{padding:min(10px,1.2dvh) 0 0}
.target-num{font-size:min(18vw,72px,9.5dvh);line-height:1.05}
.cards-area{gap:min(10px,1.2dvh)}
.card{width:min(24vw,92px,11.5dvh);height:min(24vw,92px,11.5dvh);font-size:min(28px,3.4dvh)}
.card.big-num{font-size:min(24px,3dvh)}
.op-btn{width:min(16vw,66px,8.5dvh);height:min(16vw,66px,8.5dvh);font-size:min(30px,3.6dvh)}
.history-wrap{padding:min(10px,1.2dvh) 14px}
.history-title{font-size:min(12px,1.6dvh)}
.history-item{font-size:min(18px,2.6dvh);line-height:1.4}
.result-banner{padding:min(14px,1.6dvh) 16px}
.result-banner h2{font-size:min(20px,2.8dvh)}.result-banner p{font-size:min(14px,2dvh)}
button.primary.big{font-size:min(20px,2.8dvh);padding:min(16px,2dvh) 24px}
.sbox{padding:min(6px,.8dvh) 10px}
.mode-btn{padding:min(22px,3dvh) 10px}.mode-btn .mode-icon{font-size:min(30px,4dvh)}
.handoff-name{font-size:min(52px,12vw,7dvh)}.handoff-msg{font-size:min(18px,2.6dvh)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── MOD SEÇİMİ ── -->
  <div class="screen active" id="scMode">
    <div class="game-title">Sayı Hedefi</div>
    <div class="subtitle">Verilen sayılarla hedefe ulaş</div>
    <div class="mode-btns">
      <div class="mode-btn" onclick="G.selectMode(1,true)">
        <span class="mode-icon">🎯</span>
        <span class="mode-label">Tek Kişi</span>
        <span class="mode-desc">Tek oyun</span>
        <span class="mode-desc">hızlı deneme</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(1)">
        <span class="mode-icon">🧠</span>
        <span class="mode-label">Tek Kişi</span>
        <span class="mode-desc">10 soruluk</span>
        <span class="mode-desc">meydan okuma</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(2,true)">
        <span class="mode-icon">🔁</span>
        <span class="mode-label">İki Kişi</span>
        <span class="mode-desc">Tek oyun</span>
        <span class="mode-desc">sırayla tek tur</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(2)">
        <span class="mode-icon">⚔️</span>
        <span class="mode-label">İki Kişi</span>
        <span class="mode-desc">8 soruluk</span>
        <span class="mode-desc">kıyasıya rekabet</span>
      </div>
    </div>
  </div>

  <!-- ── İSİM GİRİŞİ ── -->
  <div class="screen" id="scNames">
    <div class="game-title">Sayı Hedefi</div>
    <div class="name-form" id="nameForm"></div>
    <button class="primary" onclick="G.startGame()" style="align-self:center">Oyuna Başla →</button>
    <button class="a" onclick="G.showScreen('scMode')" style="align-self:center;font-size:10px">← Geri</button>
  </div>

  <!-- ── OYUNCU GEÇİŞ ── -->
  <div class="screen" id="scHandoff">
    <div class="handoff" id="handoffContent"></div>
  </div>

  <!-- ── OYUN ── -->
  <div class="screen" id="scGame">
    <!-- Üst bilgi -->
    <div class="topbar">
      <div style="font-size:11px;color:rgba(247,242,232,0.35)" id="gameInfo">—</div>
      <div class="timer-wrap" style="flex:1;margin-left:10px">
        <div class="timer-bar-bg"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
        <div class="timer-num" id="timerNum">90</div>
      </div>
    </div>

    <!-- Skor (2 kişide) -->
    <div class="scorebar" id="scorebar" style="display:none"></div>

    <!-- Hedef -->
    <div class="target-wrap">
      <div class="target-label">Hedef</div>
      <div class="target-num" id="targetNum">—</div>
    </div>

    <!-- Kartlar -->
    <div class="cards-area" id="cardsArea"></div>

    <!-- İşlem butonları -->
    <div class="ops-area">
      <div class="op-btn" data-op="+" onclick="G.selectOp(this)">+</div>
      <div class="op-btn" data-op="-" onclick="G.selectOp(this)">−</div>
      <div class="op-btn" data-op="*" onclick="G.selectOp(this)">×</div>
      <div class="op-btn" data-op="/" onclick="G.selectOp(this)">÷</div>
    </div>

    <!-- Hesap geçmişi -->
    <div class="history-wrap">
      <div class="history-title">İşlemler</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="msg" id="gameMsg">Bir sayı seçin.</div>
    <div class="result-banner" id="resultBanner"></div>

    <div class="br-btns" id="endBtnArea">
      <button class="a" onclick="G.timeUp(true)">⏱ Süreyi Bitir</button>
    </div>
    <div class="br-btns" id="nextArea"><button class="primary big" id="nextBtn">İLERLE</button></div>
  </div>

  <!-- ── OYUN SONU ── -->
  <div class="screen" id="scEnd">
    <div class="game-title">Oyun Bitti</div>
    <div class="final-scores" id="finalScores"></div>
    <div class="br-btns">
      <button class="primary" onclick="G.showScreen('scMode')">Yeni Oyun</button>
    </div>
  </div>
  <div class="foot"><img src="../img/THlogo.webp" alt="Tekin Hoca"></div>
</div>

<script>
const G = (function(){
  const TOTAL_TIME = 90;

  let mode, singleMode, players, scores, roundScores;
  let currentQ, currentP; // soru no, oyuncu no (0 veya 1)
  let target, cards; // cards: [{val, id, used, isResult}]
  let sel1, selOp; // seçili 1. sayı ve işlem
  let timerID, timeLeft;
  let history; // işlem geçmişi
  let bestResult; // o tura kadar bulunan en iyi sonuç
  let popId=null;

  // ── EKRAN YÖNETİMİ ──
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function selectMode(m, single){
    mode = m;
    singleMode = !!single;
    const f = document.getElementById('nameForm');
    f.innerHTML = '';
    const count = m===1?1:2;
    for(let i=0;i<count;i++){
      f.innerHTML += `
        <div class="name-row">
          <label>${m===1?'Adınız':`${i+1}. Oyuncunun Adı`}</label>
          <input type="text" id="name${i}" placeholder="${m===1?'Oyuncu':'Oyuncu '+(i+1)}" maxlength="16" autocomplete="off">
        </div>`;
    }
    showScreen('scNames');
    // Ekran geçişi tamamlandıktan sonra focus ver
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const inp=document.getElementById('name0');
      if(inp) inp.focus();
    }));
  }

  function startGame(){
    players = [];
    const count = mode===1?1:2;
    for(let i=0;i<count;i++){
      const inp = document.getElementById('name'+i);
      players.push(inp&&inp.value.trim()?inp.value.trim():`Oyuncu ${i+1}`);
    }
    scores = [0,0];
    roundScores = [[],[]];
    currentQ = 0;
    currentP = 0;
    document.getElementById('scorebar').style.display = mode===2?'flex':'none';
    showScreen('scGame');
    nextQuestion();
  }

  // ── BULMACA ÜRETME ──
  function generatePuzzle(){
    let attempt=0;
    while(attempt<1000){
      attempt++;
      const nums = generateNumbers();
      const minOps = minSolutionLength(nums);
      // Hedefe ulaşmak için gereken MİNİMUM işlem sayısı en az 3 olmalı
      if(minOps && minOps.minOps >= 3){
        return {target: minOps.result, nums};
      }
    }
    return {target: 432, nums:[3,4,6,7,8,75]};
  }

  function generateNumbers(){
    const singles=[];
    for(let i=0;i<5;i++) singles.push(Math.floor(Math.random()*9)+1);
    const bigs=[25,50,75];
    singles.push(bigs[Math.floor(Math.random()*bigs.length)]);
    return singles;
  }

  // Tüm ulaşılabilir (sonuç → minimum_işlem_sayısı) haritasını çıkar
  // Sonra 3 basamaklı, min_işlem >= 3 olan bir hedef seç
  //
  // PERFORMANS NOTU: Orijinal sürüm her (i,j) çiftini HEM (i,j) HEM (j,i)
  // olarak iki kez tarıyordu; ancak "ops" listesi zaten a-b/b-a ve a÷b/b÷a
  // ihtimallerinin ikisini de içerdiğinden bu ikinci tarama tamamen
  // gereksizdi ve arama ağacını katlanarak büyütüyordu (telefonlarda
  // sorular arasında donma hissi buradan kaynaklanıyordu). Aşağıdaki
  // sürüm yalnızca i<j çiftlerini tarar ve aynı sayı kümesinin tekrar
  // taranmasını "visited" haritasıyla engeller. Sonuç kümesi (minOpsMap)
  // matematiksel olarak birebir aynıdır; sadece hesaplama çok daha hızlıdır.
  function minSolutionLength(nums){
    // Her ulaşılabilir sayının minimum kaç işlemde bulunduğunu tut
    const minOpsMap = new Map(); // result -> minOps
    const visited = new Map();  // sıralı sayı kümesi anahtarı -> daha önce hangi derinlikte tarandığı

    function dfs(available, opsCount){
      const key = available.slice().sort((a,b)=>a-b).join(',');
      const seenAt = visited.get(key);
      if(seenAt !== undefined && seenAt <= opsCount) return;
      visited.set(key, opsCount);

      for(let i=0;i<available.length;i++){
        for(let j=i+1;j<available.length;j++){
          const a=available[i], b=available[j];
          const rest=available.filter((_,k)=>k!==i&&k!==j);
          const ops=[a+b, Math.abs(a-b), a*b];
          if(b!==0&&a%b===0) ops.push(a/b);
          if(a!==0&&b%a===0) ops.push(b/a);
          ops.forEach(r=>{
            if(!Number.isInteger(r)||r<=0) return;
            const cur = minOpsMap.get(r);
            if(cur===undefined||opsCount+1<cur){
              minOpsMap.set(r, opsCount+1);
            }
            if(rest.length>0) dfs([...rest, r], opsCount+1);
          });
        }
      }
    }
    dfs(nums, 0);

    // 3 basamaklı, minimum işlem sayısı >= 3 olan sonuçları bul
    const candidates=[];
    minOpsMap.forEach((ops, result)=>{
      if(result>=100 && result<=999 && ops>=3){
        candidates.push({result, minOps: ops});
      }
    });
    if(candidates.length===0) return null;
    // Rastgele birini seç (min 3 olanları tercih et, ama 4-5 de kabul et)
    const minThree = candidates.filter(c=>c.minOps===3);
    const pool = minThree.length>0 ? minThree : candidates;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  // ── TOPLAM SORU SAYISI ──
  function getMaxQ(){
    // Tek oyun modunda (singleMode) her zaman 1 bulmaca oynanır
    if(singleMode) return 1;
    return mode===1?10:8;
  }

  // ── SORU AKIŞI ──
  function nextQuestion(){
    // 1 kişi: 10 soru (Tek Oyun modunda: 1 soru)
    // 2 kişi: 8 tur × 2 oyuncu (Tek Oyun modunda: 1 tur × 2 oyuncu)
    // Her turda aynı bulmaca iki oyuncuya da gidiyor
    // currentQ: bulmaca no
    // currentP: hangi oyuncu oynuyor (0 veya 1)

    const maxQ = getMaxQ();

    if(mode===1){
      if(currentQ>=maxQ){ showEnd(); return; }
      // Bulmaca üretimi (özellikle 6 sayılı zor kombinasyonlarda) biraz
      // sürebildiği için önce kısa bir "hazırlanıyor" mesajı gösterip
      // ağır hesaplamayı bir sonraki an'a erteliyoruz. Böylece ekran
      // donmuş gibi görünmüyor, kullanıcı bir geri bildirim görüyor.
      setMsg('Yeni bulmaca hazırlanıyor…');
      setTimeout(()=>{
        const puzzle = generatePuzzle();
        startRound(puzzle, 0, currentQ+1, maxQ);
      }, 20);
    } else {
      if(currentQ>=maxQ){ showEnd(); return; }
      const proceedToHandoff = ()=>{
        // Hangi oyuncu başlıyor? Tur 0→P0, Tur1→P1, Tur2→P0...
        const startP = currentQ%2===0?0:1;
        const activeP = currentP===0?startP:1-startP;
        // Geçiş ekranı göster
        showHandoff(players[activeP], ()=>{
          startRound(G._currentPuzzle, activeP, currentQ+1, maxQ);
        }, activeP);
      };
      // Tur başında bulmaca üret (her tur için aynı bulmaca iki oyuncuya)
      if(currentP===0){
        setMsg('Yeni bulmaca hazırlanıyor…');
        setTimeout(()=>{
          G._currentPuzzle = generatePuzzle();
          proceedToHandoff();
        }, 20);
      } else {
        proceedToHandoff();
      }
    }
  }

  function showHandoff(name, cb, pIdx){
    const el = document.getElementById('handoffContent');
    el.innerHTML = `
      <div class="handoff-tag">Sıradaki oyuncu · Tur ${currentQ+1} / ${getMaxQ()}</div>
      <div class="handoff-name p${pIdx}">${name}</div>
      <div class="handoff-score">${players[0]} ${scores[0]} – ${scores[1]} ${players[1]}</div>
      <div class="handoff-msg">Hazır olduğunuzda <b>BAŞLA</b>’ya basın.<br>${TOTAL_TIME} saniye hemen başlar.</div>
      <button class="primary big pulse" id="handoffBtn">BAŞLA</button>`;
    showScreen('scHandoff');
    document.getElementById('handoffBtn').onclick = ()=>{ showScreen('scGame'); cb(); };
  }

  let roundOver = false;

  function startRound(puzzle, playerIdx, qNum, maxQ){
    target = puzzle.target;
    cards = puzzle.nums.map((v,i)=>({val:v, id:i, used:false, isResult:false}));
    sel1 = null; selOp = null;
    history = [];
    bestResult = null;
    timeLeft = TOTAL_TIME;
    roundOver = false;

    document.getElementById('gameInfo').textContent =
      mode===1
        ? `Soru ${qNum} / ${maxQ}`
        : `Tur ${qNum} / ${maxQ} — ${players[playerIdx]}`;

    if(mode===2) updateScorebar(playerIdx);

    const tn=document.getElementById('targetNum'); tn.textContent = target; tn.classList.remove('pop'); void tn.offsetWidth; tn.classList.add('pop');
    document.getElementById('nextArea').style.display='none';
    document.getElementById('resultBanner').className = 'result-banner';
    document.getElementById('historyList').innerHTML = '';
    document.getElementById('endBtnArea').style.display = 'flex';
    setMsg('Bir sayı seçin.');

    renderCards();
    clearOps();
    startTimer(playerIdx, qNum, maxQ);
  }

  function startTimer(playerIdx, qNum, maxQ){
    clearInterval(timerID);
    updateTimer();
    timerID = setInterval(()=>{
      timeLeft--;
      updateTimer();
      if(timeLeft<=0){ clearInterval(timerID); timeUp(false, playerIdx, qNum, maxQ); }
    },1000);
    // Expose for button
    G._timerCtx = {playerIdx, qNum, maxQ};
  }

  function updateTimer(){
    const pct = (timeLeft/TOTAL_TIME)*100;
    document.getElementById('timerBar').style.width = pct+'%';
    const tb=document.getElementById('timerBar'), tc=timeLeft>30?'#c8960c':timeLeft>15?'#e67e22':'#e74c3c';
    tb.style.background=`linear-gradient(90deg,${tc}88,${tc})`; tb.style.boxShadow=`0 0 10px ${tc}`; tb.classList.toggle('low',timeLeft<=15);
    document.getElementById('timerNum').textContent = timeLeft;
  }

  function timeUp(manual, playerIdx, qNum, maxQ){
    if(roundOver) return;
    roundOver = true;
    if(manual){ clearInterval(timerID); const ctx=G._timerCtx; playerIdx=ctx.playerIdx; qNum=ctx.qNum; maxQ=ctx.maxQ; }
    clearInterval(timerID);

    // Süreyi bitir butonunu gizle
    document.getElementById('endBtnArea').style.display = 'none';

    // En iyi sonucu bul: mevcut kartlardaki ara sonuçlar dahil
    let best = bestResult;
    cards.forEach(c=>{ if(!c.used){ const d=Math.abs(c.val-target); if(best===null||d<Math.abs(best-target)) best=c.val; } });
    if(best===null) best=0;

    const diff = Math.abs(best-target);
    const pts = diff===0?20:diff<20?20-diff:0;

    // Sonuç bandı
    const banner = document.getElementById('resultBanner');
    if(diff===0){
      banner.className='result-banner show exact';
      banner.innerHTML=`<h2>🎯 TAM İSABET!</h2><p>${players[playerIdx]}, hedefe ulaştınız! <b>+${pts} puan</b></p>`;
    } else if(pts>0){
      banner.className='result-banner show close';
      banner.innerHTML=`<h2>Hedef: ${target}</h2><p>Ulaşılan: <b>${best}</b> — Fark: <b>${diff}</b></p><p style="margin-top:4px">Puan: <b>+${pts}</b></p>`;
    } else {
      banner.className='result-banner show miss';
      banner.innerHTML=`<h2>Hedef: ${target}</h2><p>Ulaşılan: <b>${best===0?'Yok':best}</b>${best>0?` — Fark: <b>${diff}</b>`:''}</p><p style="margin-top:4px">Puan: <b>0</b></p>`;
    }

    scores[playerIdx] += pts;
    if(mode===2) roundScores[playerIdx].push(pts);

    fx(diff,pts);
    const advance=()=>{
      if(mode===1){ currentQ++; nextQuestion(); }
      else if(currentP===0){ currentP=1; nextQuestion(); }
      else { currentP=0; currentQ++; nextQuestion(); }
    };
    if(mode===1&&!singleMode){
      // 10 soruluk tek kişi modu: İLERLE butonu (ilk 0,8 sn etkin değil: yanlışlıkla geçmeyi önler)
      const nb=document.getElementById('nextBtn'), na=document.getElementById('nextArea');
      nb.textContent=(currentQ+1>=getMaxQ())?'SONUÇLARI GÖR':'İLERLE';
      nb.disabled=true; na.style.display='flex';
      na.scrollIntoView({behavior:'smooth',block:'nearest'});
      setTimeout(()=>{nb.disabled=false;},800);
      nb.onclick=()=>{ if(nb.disabled) return; nb.disabled=true; na.style.display='none'; advance(); };
    } else setTimeout(advance,2800);
  }

  // ── KART & İŞLEM ──
  function renderCards(){
    const area = document.getElementById('cardsArea');
    area.innerHTML='';
    cards.forEach((c,i)=>{
      if(c.used) return;
      const el=document.createElement('div');
      el.className='card'+(c.isResult?' result-card':'')+(sel1===i?' selected':'')+(c.id===popId?' pop':'')+(c.val>=10?' big-num':'');
      el.textContent=c.val;
      el.onclick=()=>G.selectCard(i);
      area.appendChild(el);
    });
    popId=null;
  }

  function selectCard(i){
    if(cards[i].used) return; vib(10);
    if(sel1===null){
      sel1=i; renderCards(); setMsg('İşlem sembolü seçin.');
    } else if(sel1===i){
      sel1=null; selOp=null; clearOps(); renderCards(); setMsg('Bir sayı seçin.');
    } else if(selOp!==null){
      doOp(sel1,i);
    } else {
      sel1=i; renderCards(); setMsg('İşlem sembolü seçin.');
    }
  }

  function selectOp(el){ vib(10);
    if(sel1===null){setMsg('Önce bir sayı seçin.',true);return;}
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('op-selected'));
    el.classList.add('op-selected');
    selOp=el.dataset.op;
    setMsg('İkinci sayıyı seçin.');
  }

  function doOp(i,j){
    const a=cards[i].val, b=cards[j].val;
    let res;
    const opSym={'+':'+','-':'−','*':'×','/':'÷'};
    switch(selOp){
      case '+': res=a+b; break;
      case '-': res=a-b; break;
      case '*': res=a*b; break;
      case '/': res=(b!==0&&a%b===0)?a/b:null; break;
    }
    if(res===null||!Number.isInteger(res)||res<=0){
      setMsg('Geçersiz işlem! Sonuç bir doğal sayı olmalı.',true);
      sel1=null;selOp=null;clearOps();renderCards();return;
    }
    // Geçmişe ekle
    const line=`${a} ${opSym[selOp]} ${b} = ${res}`;
    history.push(line); vib(16);
    const hl=document.getElementById('historyList');
    const item=document.createElement('div');item.className='history-item';
    item.innerHTML=`<span>${res}</span> = ${a} <b style="color:rgb(${OPC[selOp]})">${opSym[selOp]}</b> ${b}`;
    hl.appendChild(item);

    // Kartları güncelle
    cards[i].used=true; cards[j].used=true;
    const newId=cards.length;
    cards.push({val:res,id:newId,used:false,isResult:true}); popId=newId;

    // En iyi sonucu takip et
    const diff=Math.abs(res-target);
    if(bestResult===null||diff<Math.abs(bestResult-target)) bestResult=res;

    sel1=null;selOp=null;clearOps();renderCards();

    if(res===target){
      setMsg('🎯 Hedefe ulaştınız!','good');
      document.getElementById('endBtnArea').style.display='none';
      setTimeout(()=>timeUp(false,...Object.values(G._timerCtx)),600);
    } else {
      const remaining=cards.filter(c=>!c.used);
      if(remaining.length<=1){
        // Tek kart kaldı, daha fazla işlem yapılamaz — otomatik bitir
        document.getElementById('endBtnArea').style.display='none';
        setMsg('Tüm sayılar kullanıldı.');
        setTimeout(()=>timeUp(false,...Object.values(G._timerCtx)),800);
      } else {
        setMsg('Devam edin veya süreyi bitirin.');
      }
    }
  }

  function clearOps(){
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('op-selected'));
    selOp=null;
  }

  // ── SKOR BAR ──
  function updateScorebar(activeP){
    const sb=document.getElementById('scorebar');
    sb.innerHTML='';
    players.forEach((name,i)=>{
      const div=document.createElement('div');
      div.className='sbox'+(i===activeP?' active-player':'');
      div.innerHTML=`<div class="sname">${name}</div><div class="sscore">${scores[i]}</div>`;
      sb.appendChild(div);
    });
  }

  function showEnd(){
    const fs=document.getElementById('finalScores');
    fs.innerHTML='';
    if(mode===1){
      const div=document.createElement('div');
      div.className='final-row winner';
      const detail = singleMode ? '1 soruluk hızlı deneme tamamlandı' : '10 soruluk yarışma tamamlandı';
      div.innerHTML=`
        <div>
          <div class="final-name">${players[0]}</div>
          <div class="final-detail">${detail}</div>
        </div>
        <div class="final-score">${scores[0]} puan</div>`;
      fs.appendChild(div);
    } else {
      const sorted=[0,1].map(i=>({name:players[i],score:scores[i],idx:i,rounds:roundScores[i]}))
        .sort((a,b)=>b.score-a.score);
      const maxScore=sorted[0].score;
      sorted.forEach((p,rank)=>{
        const isWinner=p.score===maxScore;
        const div=document.createElement('div');
        div.className='final-row'+(isWinner?' winner':'');
        div.innerHTML=`
          <div>
            <div class="final-name">${rank===0?'🏆 ':''}${p.name}</div>
            <div class="final-detail">Turlar: ${p.rounds.join(', ')}</div>
          </div>
          <div class="final-score">${p.score} puan</div>`;
        fs.appendChild(div);
      });
      if(sorted[0].score===sorted[1].score){
        const tie=document.createElement('div');
        tie.style.cssText='text-align:center;font-size:12px;color:rgba(247,242,232,0.4);padding:4px';
        tie.textContent='Berabere!';
        fs.appendChild(tie);
      }
    }
    showScreen('scEnd');
  }

  const OPC={'+':'61,220,151','-':'255,107,107','*':'179,136,255','/':'77,208,225'};
  const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}; // yalnızca Chromium tabanlı Android tarayıcılarda çalışır
  function fx(diff,pts){
    if(diff===0) vib([30,40,60]);
    if(REDUCED) return;
    const box=document.getElementById('fx');
    const n=diff===0?(innerWidth<500?26:40):(pts>0?8:0);
    const cols=['#c8960c','#ffd966','#50c878','#4dd0e1','#b388ff','#ff6b6b'];
    for(let i=0;i<n;i++){
      const e=document.createElement('i'), ang=Math.random()*6.283, d=90+Math.random()*(diff===0?200:110);
      e.style.cssText=`--dx:${Math.cos(ang)*d}px;--dy:${Math.sin(ang)*d-60}px;--r:${Math.random()*720-360}deg;background:${cols[i%cols.length]}`;
      box.appendChild(e); setTimeout(()=>e.remove(),1400);
    }
    if(pts>0){ const t=document.createElement('b'); t.textContent='+'+pts; box.appendChild(t); setTimeout(()=>t.remove(),1500); }
  }

  function setMsg(t, type){
    const el=document.getElementById('gameMsg');
    el.textContent=t;
    el.className='msg'+(type===true?' warn':type==='good'?' good':'');
  }

  return {showScreen,selectMode,startGame,selectCard,selectOp,timeUp,_currentPuzzle:null,_timerCtx:{}};
})();
</script>

<div id="fx"></div>


</body>
