<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Sayı Hedefi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 8%,#17243a 0%,#0d1422 48%,#080d17 100%);font-family:Georgia,serif;display:flex;align-items:flex-start;justify-content:center;padding:8px;overflow-y:auto;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.wrap{width:100%;max-width:540px;display:flex;flex-direction:column;gap:10px;margin:0 auto;padding:4px 0 20px}

/* ── EKRANLAR ── */
.screen{display:none;flex-direction:column;gap:12px;animation:fadeIn .35s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── BAŞLIK ── */
.game-title{font-size:18px;font-weight:700;color:#f0c75e;text-shadow:0 0 18px rgba(240,199,94,.22);letter-spacing:.08em;text-align:center}
.subtitle{font-size:11px;color:rgba(218,229,245,0.58);text-align:center;letter-spacing:.05em}

/* ── MOD SEÇİMİ ── */
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-btn{background:linear-gradient(145deg,rgba(35,53,78,.78),rgba(17,28,45,.9));border:1px solid rgba(220,177,75,0.42);border-radius:6px;padding:18px 10px;cursor:pointer;color:rgba(247,242,232,0.7);font-family:Georgia,serif;font-size:13px;transition:all .2s;text-align:center;min-width:0}
.mode-btn:hover{background:linear-gradient(145deg,rgba(54,75,103,.9),rgba(25,42,65,.96));color:#fff0c5;border-color:rgba(240,199,94,.85);box-shadow:0 0 22px rgba(240,199,94,.13),inset 0 0 18px rgba(240,199,94,.05)}
.mode-btn .mode-icon{font-size:26px;display:block;margin-bottom:6px}
.mode-btn .mode-label{font-weight:700;display:block;margin-bottom:3px}
.mode-btn .mode-desc{font-size:10px;color:rgba(218,229,245,0.55);display:block}

/* ── İSİM GİRİŞİ ── */
.name-form{display:flex;flex-direction:column;gap:10px}
.name-row{display:flex;flex-direction:column;gap:4px}
.name-row label{font-size:10px;color:rgba(218,229,245,0.62);text-transform:uppercase;letter-spacing:.08em}
.name-row input{background:#111d2d;border:1px solid rgba(220,177,75,0.38);border-radius:4px;padding:8px 12px;color:#e8d5a0;font-family:Georgia,serif;font-size:14px;outline:none;transition:border-color .2s}
.name-row input:focus{border-color:#f0c75e;box-shadow:0 0 0 3px rgba(240,199,94,.10)}
.name-row input::placeholder{color:rgba(247,242,232,0.2)}

/* ── BUTONLAR ── */
button.a{background:rgba(31,48,70,.72);border:1px solid rgba(220,177,75,0.35);border-radius:4px;padding:7px 16px;font-size:11px;cursor:pointer;color:rgba(247,242,232,0.7);font-family:Georgia,serif;transition:background .2s}
button.a:hover{background:rgba(55,76,105,.85);border-color:rgba(240,199,94,.7)}
button.primary{background:linear-gradient(135deg,#9b7017,#d5a832);border:1px solid #f0cf78;border-radius:4px;padding:10px 24px;font-size:13px;cursor:pointer;color:#e8d5a0;font-family:Georgia,serif;font-weight:700;transition:all .2s;letter-spacing:.04em}
button.primary:hover{background:linear-gradient(135deg,#b48620,#edc34f);box-shadow:0 0 20px rgba(240,199,94,.2)}

/* ── ÜSTTBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.infobar{display:flex;gap:6px}
.ibox{background:rgba(34,52,76,.48);border:1px solid rgba(164,190,222,0.13);border-radius:5px;padding:5px 8px;flex:1;text-align:center}
.ibox .l{font-size:9px;color:rgba(218,229,245,0.48);text-transform:uppercase;letter-spacing:.07em;margin-bottom:1px}
.ibox .v{font-size:14px;font-weight:700;color:#f0c75e}

/* ── SKOR TABLOSU ── */
.scorebar{display:flex;gap:6px}
.sbox{background:rgba(34,52,76,.48);border:1px solid rgba(164,190,222,0.13);border-radius:5px;padding:6px 10px;flex:1;text-align:center;transition:all .3s}
.sbox.active-player{background:rgba(207,157,43,.15);border-color:rgba(240,199,94,.62);box-shadow:0 0 16px rgba(240,199,94,.09)}
.sbox .sname{font-size:10px;color:rgba(218,229,245,0.66);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox .sscore{font-size:18px;font-weight:700;color:#f0c75e}

/* ── HEDEF ── */
.target-wrap{text-align:center;padding:14px 0 8px}
.target-label{font-size:10px;color:rgba(218,229,245,0.55);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.target-num{font-size:52px;font-weight:700;color:#ffe6a0;letter-spacing:.04em;line-height:1;text-shadow:0 0 18px rgba(240,199,94,.38),0 0 42px rgba(240,199,94,.20)}

/* ── SÜRE ── */
.timer-wrap{display:flex;align-items:center;gap:8px}
.timer-bar-bg{flex:1;height:7px;background:rgba(190,208,232,0.12);border-radius:3px;overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,#16a6a0,#e7b83e);border-radius:3px;transition:width .5s linear,background .5s}
.timer-num{font-size:13px;font-weight:700;color:#f0c75e;min-width:28px;text-align:right}

/* ── KARTLAR ── */
.cards-area{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.card{
  width:68px;height:68px;display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:#e8d5a0;
  background:linear-gradient(145deg,#26364b,#172538);
  border:1.5px solid rgba(220,177,75,0.55);border-radius:9px;
  cursor:pointer;transition:all .15s;user-select:none;
  box-shadow:0 5px 13px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;
}
.card:hover:not(.used):not(.selected){background:linear-gradient(145deg,#354d68,#203650);border-color:#f0c75e;box-shadow:0 0 18px rgba(240,199,94,.16)}
.card.selected{background:linear-gradient(145deg,#57451e,#29384a);border-color:#ffd66e;border-width:2px;box-shadow:0 0 12px rgba(240,199,94,.48),0 0 28px rgba(240,199,94,.18)}
.card.used{opacity:.22;cursor:default;filter:grayscale(60%)}
.card.result-card{background:linear-gradient(145deg,#123d43,#102b3c);border-color:rgba(67,220,201,.75);color:#72f0d7;box-shadow:0 0 15px rgba(67,220,201,.14),inset 0 1px 0 rgba(255,255,255,.08)}
.card.big-num{font-size:18px}

/* ── İŞLEMLER ── */
.ops-area{display:flex;gap:8px;justify-content:center}
.op-btn{
  width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:rgba(247,242,232,0.6);
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);
  border-radius:6px;cursor:pointer;transition:all .15s;user-select:none;
}
.op-btn:hover:not(.op-selected){background:linear-gradient(145deg,#3a526f,#263c57);color:#fff0c5;border-color:rgba(240,199,94,.55)}
.op-btn.op-selected{background:linear-gradient(145deg,#66501e,#3d3b2d);border-color:#ffd66e;color:#ffe6a0;box-shadow:0 0 16px rgba(240,199,94,.28)}

/* ── HESAP GEÇMİŞİ ── */
.history-wrap{background:linear-gradient(145deg,rgba(24,39,58,.72),rgba(13,23,37,.78));border:1px solid rgba(164,190,222,0.16);border-radius:5px;padding:8px 12px;min-height:48px}
.history-title{font-size:10px;color:rgba(218,229,245,0.58);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.history-list{display:flex;flex-direction:column;gap:3px}
.history-item{font-size:14px;color:rgba(225,235,248,0.72);line-height:1.45;font-family:Georgia,serif}
.history-item span{color:#f0c75e;font-weight:700}

/* ── MESAJ ── */
.msg{font-size:12px;color:rgba(218,229,245,0.66);text-align:center;min-height:15px}
.msg.warn{color:#e74c3c}
.msg.good{color:#72f0b0;text-shadow:0 0 12px rgba(80,220,145,.25)}

/* ── SONUÇ BANDI ── */
.result-banner{display:none;border-radius:5px;padding:10px 14px;text-align:center}
.result-banner.show{display:block}
.result-banner.exact{background:linear-gradient(135deg,rgba(20,91,65,.34),rgba(15,48,52,.55));border:1px solid rgba(93,232,160,.62);box-shadow:0 0 22px rgba(80,220,145,.12)}
.result-banner.close{background:linear-gradient(135deg,rgba(111,79,20,.24),rgba(55,48,31,.42));border:1px solid rgba(240,199,94,.52)}
.result-banner.miss{background:linear-gradient(135deg,rgba(67,54,42,.28),rgba(31,38,48,.48));border:1px solid rgba(190,151,103,.28)}
.result-banner h2{font-size:14px;margin-bottom:3px}
.result-banner.exact h2{color:#72f0b0;text-shadow:0 0 14px rgba(80,220,145,.25)}
.result-banner.close h2{color:#f0c75e}
.result-banner.miss h2{color:rgba(218,229,245,0.62)}
.result-banner p{font-size:12px;color:rgba(225,235,248,0.72)}


/* ── İLERLE BUTONU ── */
button.next-btn{
  min-width:190px;
  padding:13px 30px;
  font-size:15px;
  letter-spacing:.06em;
  background:linear-gradient(135deg,#a77a1c,#e3b83e);
  border:1px solid #ffe08a;
  color:#fff8df;
  box-shadow:0 5px 18px rgba(220,171,55,.20),inset 0 1px 0 rgba(255,255,255,.22);
  animation:nextPulse 2s ease-in-out infinite;
}
button.next-btn:hover{
  background:linear-gradient(135deg,#bd902b,#f0ca58);
  box-shadow:0 0 24px rgba(240,199,94,.32);
  transform:translateY(-1px);
}
@keyframes nextPulse{
  0%,100%{box-shadow:0 5px 18px rgba(220,171,55,.16),inset 0 1px 0 rgba(255,255,255,.22)}
  50%{box-shadow:0 5px 24px rgba(240,199,94,.32),0 0 12px rgba(240,199,94,.14),inset 0 1px 0 rgba(255,255,255,.25)}
}
@media(max-width:600px){
  .history-item{font-size:15px;line-height:1.5}
  .history-title{font-size:10px}
  .handoff-msg{font-size:17px}
  .handoff-name{font-size:28px}
  button.next-btn{width:min(78%,300px);min-height:52px;font-size:16px}
}

/* ── OYUN SONU ── */
.final-scores{display:flex;flex-direction:column;gap:8px}
.final-row{display:flex;align-items:center;justify-content:space-between;background:rgba(34,52,76,.48);border:1px solid rgba(164,190,222,0.16);border-radius:5px;padding:10px 14px}
.final-row.winner{background:linear-gradient(135deg,rgba(125,91,24,.25),rgba(34,52,76,.55));border-color:rgba(240,199,94,.58);box-shadow:0 0 18px rgba(240,199,94,.08)}
.final-name{font-size:13px;color:#ffe6a0;font-weight:700}
.final-score{font-size:20px;font-weight:700;color:#f0c75e}
.final-detail{font-size:10px;color:rgba(218,229,245,0.55);margin-top:2px}
.br-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* ── OYUNCU GEÇİŞ EKRANI ── */
.handoff{text-align:center;padding:20px 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.handoff-name{font-size:26px;font-weight:700;color:#f0c75e;text-shadow:0 0 20px rgba(240,199,94,.25)}
.handoff-msg{font-size:16px;color:rgba(225,235,248,0.88);font-weight:600;text-shadow:0 0 14px rgba(120,175,225,.16)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── MOD SEÇİMİ ── -->
  <div class="screen active" id="scMode">
    <div class="game-title">Sayı Hedefi</div>
    <div class="subtitle">Verilen sayılarla hedefe ulaş</div>
    <div class="mode-btns">
      <div class="mode-btn" onclick="G.selectMode(1,true)">
        <span class="mode-icon">🎯</span>
        <span class="mode-label">Tek Kişi</span>
        <span class="mode-desc">Tek oyun</span>
        <span class="mode-desc">hızlı deneme</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(1)">
        <span class="mode-icon">🧠</span>
        <span class="mode-label">Tek Kişi</span>
        <span class="mode-desc">10 soruluk</span>
        <span class="mode-desc">meydan okuma</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(2,true)">
        <span class="mode-icon">🔁</span>
        <span class="mode-label">İki Kişi</span>
        <span class="mode-desc">Tek oyun</span>
        <span class="mode-desc">sırayla tek tur</span>
      </div>
      <div class="mode-btn" onclick="G.selectMode(2)">
        <span class="mode-icon">⚔️</span>
        <span class="mode-label">İki Kişi</span>
        <span class="mode-desc">8 soruluk</span>
        <span class="mode-desc">kıyasıya rekabet</span>
      </div>
    </div>
  </div>

  <!-- ── İSİM GİRİŞİ ── -->
  <div class="screen" id="scNames">
    <div class="game-title">Sayı Hedefi</div>
    <div class="name-form" id="nameForm"></div>
    <button class="primary" onclick="G.startGame()" style="align-self:center">Oyuna Başla →</button>
    <button class="a" onclick="G.showScreen('scMode')" style="align-self:center;font-size:10px">← Geri</button>
  </div>

  <!-- ── OYUNCU GEÇİŞ ── -->
  <div class="screen" id="scHandoff">
    <div class="handoff" id="handoffContent"></div>
  </div>

  <!-- ── OYUN ── -->
  <div class="screen" id="scGame">
    <!-- Üst bilgi -->
    <div class="topbar">
      <div style="font-size:11px;color:rgba(247,242,232,0.35)" id="gameInfo">—</div>
      <div class="timer-wrap" style="flex:1;margin-left:10px">
        <div class="timer-bar-bg"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
        <div class="timer-num" id="timerNum">90</div>
      </div>
    </div>

    <!-- Skor (2 kişide) -->
    <div class="scorebar" id="scorebar" style="display:none"></div>

    <!-- Hedef -->
    <div class="target-wrap">
      <div class="target-label">Hedef</div>
      <div class="target-num" id="targetNum">—</div>
    </div>

    <!-- Kartlar -->
    <div class="cards-area" id="cardsArea"></div>

    <!-- İşlem butonları -->
    <div class="ops-area">
      <div class="op-btn" data-op="+" onclick="G.selectOp(this)">+</div>
      <div class="op-btn" data-op="-" onclick="G.selectOp(this)">−</div>
      <div class="op-btn" data-op="*" onclick="G.selectOp(this)">×</div>
      <div class="op-btn" data-op="/" onclick="G.selectOp(this)">÷</div>
    </div>

    <!-- Hesap geçmişi -->
    <div class="history-wrap">
      <div class="history-title">İşlemler</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="msg" id="gameMsg">Bir sayı seçin.</div>
    <div class="result-banner" id="resultBanner"></div>

    <div class="br-btns" id="endBtnArea">
      <button class="a" onclick="G.timeUp(true)">⏱ Süreyi Bitir</button>
    </div>
  </div>

  <!-- ── OYUN SONU ── -->
  <div class="screen" id="scEnd">
    <div class="game-title">Oyun Bitti</div>
    <div class="final-scores" id="finalScores"></div>
    <div class="br-btns">
      <button class="primary" onclick="G.showScreen('scMode')">Yeni Oyun</button>
    </div>
  </div>
</div>

<script>
const G = (function(){
  const TOTAL_TIME = 90;

  let mode, singleMode, players, scores, roundScores;
  let currentQ, currentP; // soru no, oyuncu no (0 veya 1)
  let target, cards; // cards: [{val, id, used, isResult}]
  let sel1, selOp; // seçili 1. sayı ve işlem
  let timerID, timeLeft;
  let history; // işlem geçmişi
  let bestResult; // o tura kadar bulunan en iyi sonuç

  // ── EKRAN YÖNETİMİ ──
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function selectMode(m, single){
    mode = m;
    singleMode = !!single;
    const f = document.getElementById('nameForm');
    f.innerHTML = '';
    const count = m===1?1:2;
    for(let i=0;i<count;i++){
      f.innerHTML += `
        <div class="name-row">
          <label>${m===1?'Adınız':`${i+1}. Oyuncunun Adı`}</label>
          <input type="text" id="name${i}" placeholder="${m===1?'Oyuncu':'Oyuncu '+(i+1)}" maxlength="16" autocomplete="off">
        </div>`;
    }
    showScreen('scNames');
    // Ekran geçişi tamamlandıktan sonra focus ver
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const inp=document.getElementById('name0');
      if(inp) inp.focus();
    }));
  }

  function startGame(){
    players = [];
    const count = mode===1?1:2;
    for(let i=0;i<count;i++){
      const inp = document.getElementById('name'+i);
      players.push(inp&&inp.value.trim()?inp.value.trim():`Oyuncu ${i+1}`);
    }
    scores = [0,0];
    roundScores = [[],[]];
    currentQ = 0;
    currentP = 0;
    document.getElementById('scorebar').style.display = mode===2?'flex':'none';
    showScreen('scGame');
    nextQuestion();
  }

  // ── BULMACA ÜRETME ──
  function generatePuzzle(){
    let attempt=0;
    while(attempt<1000){
      attempt++;
      const nums = generateNumbers();
      const minOps = minSolutionLength(nums);
      // Hedefe ulaşmak için gereken MİNİMUM işlem sayısı en az 3 olmalı
      if(minOps && minOps.minOps >= 3){
        return {target: minOps.result, nums};
      }
    }
    return {target: 432, nums:[3,4,6,7,8,75]};
  }

  function generateNumbers(){
    const singles=[];
    for(let i=0;i<5;i++) singles.push(Math.floor(Math.random()*9)+1);
    const bigs=[25,50,75];
    singles.push(bigs[Math.floor(Math.random()*bigs.length)]);
    return singles;
  }

  // Tüm ulaşılabilir (sonuç → minimum_işlem_sayısı) haritasını çıkar
  // Sonra 3 basamaklı, min_işlem >= 3 olan bir hedef seç
  //
  // PERFORMANS NOTU: Orijinal sürüm her (i,j) çiftini HEM (i,j) HEM (j,i)
  // olarak iki kez tarıyordu; ancak "ops" listesi zaten a-b/b-a ve a÷b/b÷a
  // ihtimallerinin ikisini de içerdiğinden bu ikinci tarama tamamen
  // gereksizdi ve arama ağacını katlanarak büyütüyordu (telefonlarda
  // sorular arasında donma hissi buradan kaynaklanıyordu). Aşağıdaki
  // sürüm yalnızca i<j çiftlerini tarar ve aynı sayı kümesinin tekrar
  // taranmasını "visited" haritasıyla engeller. Sonuç kümesi (minOpsMap)
  // matematiksel olarak birebir aynıdır; sadece hesaplama çok daha hızlıdır.
  function minSolutionLength(nums){
    // Her ulaşılabilir sayının minimum kaç işlemde bulunduğunu tut
    const minOpsMap = new Map(); // result -> minOps
    const visited = new Map();  // sıralı sayı kümesi anahtarı -> daha önce hangi derinlikte tarandığı

    function dfs(available, opsCount){
      const key = available.slice().sort((a,b)=>a-b).join(',');
      const seenAt = visited.get(key);
      if(seenAt !== undefined && seenAt <= opsCount) return;
      visited.set(key, opsCount);

      for(let i=0;i<available.length;i++){
        for(let j=i+1;j<available.length;j++){
          const a=available[i], b=available[j];
          const rest=available.filter((_,k)=>k!==i&&k!==j);
          const ops=[a+b, Math.abs(a-b), a*b];
          if(b!==0&&a%b===0) ops.push(a/b);
          if(a!==0&&b%a===0) ops.push(b/a);
          ops.forEach(r=>{
            if(!Number.isInteger(r)||r<=0) return;
            const cur = minOpsMap.get(r);
            if(cur===undefined||opsCount+1<cur){
              minOpsMap.set(r, opsCount+1);
            }
            if(rest.length>0) dfs([...rest, r], opsCount+1);
          });
        }
      }
    }
    dfs(nums, 0);

    // 3 basamaklı, minimum işlem sayısı >= 3 olan sonuçları bul
    const candidates=[];
    minOpsMap.forEach((ops, result)=>{
      if(result>=100 && result<=999 && ops>=3){
        candidates.push({result, minOps: ops});
      }
    });
    if(candidates.length===0) return null;
    // Rastgele birini seç (min 3 olanları tercih et, ama 4-5 de kabul et)
    const minThree = candidates.filter(c=>c.minOps===3);
    const pool = minThree.length>0 ? minThree : candidates;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  // ── TOPLAM SORU SAYISI ──
  function getMaxQ(){
    // Tek oyun modunda (singleMode) her zaman 1 bulmaca oynanır
    if(singleMode) return 1;
    return mode===1?10:8;
  }

  // ── SORU AKIŞI ──
  function nextQuestion(){
    // 1 kişi: 10 soru (Tek Oyun modunda: 1 soru)
    // 2 kişi: 8 tur × 2 oyuncu (Tek Oyun modunda: 1 tur × 2 oyuncu)
    // Her turda aynı bulmaca iki oyuncuya da gidiyor
    // currentQ: bulmaca no
    // currentP: hangi oyuncu oynuyor (0 veya 1)

    const maxQ = getMaxQ();

    if(mode===1){
      if(currentQ>=maxQ){ showEnd(); return; }
      // Bulmaca üretimi (özellikle 6 sayılı zor kombinasyonlarda) biraz
      // sürebildiği için önce kısa bir "hazırlanıyor" mesajı gösterip
      // ağır hesaplamayı bir sonraki an'a erteliyoruz. Böylece ekran
      // donmuş gibi görünmüyor, kullanıcı bir geri bildirim görüyor.
      setMsg('Yeni bulmaca hazırlanıyor…');
      setTimeout(()=>{
        const puzzle = generatePuzzle();
        startRound(puzzle, 0, currentQ+1, maxQ);
      }, 20);
    } else {
      if(currentQ>=maxQ){ showEnd(); return; }
      const proceedToHandoff = ()=>{
        // Hangi oyuncu başlıyor? Tur 0→P0, Tur1→P1, Tur2→P0...
        const startP = currentQ%2===0?0:1;
        const activeP = currentP===0?startP:1-startP;
        // Geçiş ekranı göster
        showHandoff(players[activeP], ()=>{
          startRound(G._currentPuzzle, activeP, currentQ+1, maxQ);
        });
      };
      // Tur başında bulmaca üret (her tur için aynı bulmaca iki oyuncuya)
      if(currentP===0){
        setMsg('Yeni bulmaca hazırlanıyor…');
        setTimeout(()=>{
          G._currentPuzzle = generatePuzzle();
          proceedToHandoff();
        }, 20);
      } else {
        proceedToHandoff();
      }
    }
  }

  function showHandoff(name, cb){
    const el = document.getElementById('handoffContent');
    el.innerHTML = `
      <div class="handoff-msg">Sıra sende</div>
      <div class="handoff-name">${name}</div>
      <div class="handoff-msg">Hazır olduğunda başlayabilirsin.</div>
      <button class="primary" id="handoffBtn">Başla →</button>`;
    showScreen('scHandoff');
    document.getElementById('handoffBtn').onclick = ()=>{ showScreen('scGame'); cb(); };
  }

  let roundOver = false;

  function startRound(puzzle, playerIdx, qNum, maxQ){
    target = puzzle.target;
    cards = puzzle.nums.map((v,i)=>({val:v, id:i, used:false, isResult:false}));
    sel1 = null; selOp = null;
    history = [];
    bestResult = null;
    timeLeft = TOTAL_TIME;
    roundOver = false;

    document.getElementById('gameInfo').textContent =
      mode===1
        ? `Soru ${qNum} / ${maxQ}`
        : `Tur ${qNum} / ${maxQ} — ${players[playerIdx]}`;

    if(mode===2) updateScorebar(playerIdx);

    document.getElementById('targetNum').textContent = target;
    document.getElementById('resultBanner').className = 'result-banner';
    document.getElementById('historyList').innerHTML = '';
    document.getElementById('endBtnArea').innerHTML =
      '<button class="a" onclick="G.timeUp(true)">⏱ Süreyi Bitir</button>';
    document.getElementById('endBtnArea').style.display = 'flex';
    setMsg('Bir sayı seçin.');

    renderCards();
    clearOps();
    startTimer(playerIdx, qNum, maxQ);
  }

  function startTimer(playerIdx, qNum, maxQ){
    clearInterval(timerID);
    updateTimer();
    timerID = setInterval(()=>{
      timeLeft--;
      updateTimer();
      if(timeLeft<=0){ clearInterval(timerID); timeUp(false, playerIdx, qNum, maxQ); }
    },1000);
    // Expose for button
    G._timerCtx = {playerIdx, qNum, maxQ};
  }

  function updateTimer(){
    const pct = (timeLeft/TOTAL_TIME)*100;
    document.getElementById('timerBar').style.width = pct+'%';
    document.getElementById('timerBar').style.background =
      timeLeft>30?'#c8960c':timeLeft>15?'#e67e22':'#e74c3c';
    document.getElementById('timerNum').textContent = timeLeft;
  }

  function timeUp(manual, playerIdx, qNum, maxQ){
    if(roundOver) return;
    roundOver = true;
    if(manual){ clearInterval(timerID); const ctx=G._timerCtx; playerIdx=ctx.playerIdx; qNum=ctx.qNum; maxQ=ctx.maxQ; }
    clearInterval(timerID);

    // Süreyi bitir butonunu gizle
    document.getElementById('endBtnArea').style.display = 'none';

    // En iyi sonucu bul: mevcut kartlardaki ara sonuçlar dahil
    let best = bestResult;
    cards.forEach(c=>{ if(!c.used){ const d=Math.abs(c.val-target); if(best===null||d<Math.abs(best-target)) best=c.val; } });
    if(best===null) best=0;

    const diff = Math.abs(best-target);
    const pts = diff===0?20:diff<20?20-diff:0;

    // Sonuç bandı
    const banner = document.getElementById('resultBanner');
    if(diff===0){
      banner.className='result-banner show exact';
      banner.innerHTML=`<h2>🎯 TAM İSABET!</h2><p>${players[playerIdx]}, hedefe ulaştınız! <b>+${pts} puan</b></p>`;
    } else if(pts>0){
      banner.className='result-banner show close';
      banner.innerHTML=`<h2>Hedef: ${target}</h2><p>Ulaşılan: <b>${best}</b> — Fark: <b>${diff}</b></p><p style="margin-top:4px">Puan: <b>+${pts}</b></p>`;
    } else {
      banner.className='result-banner show miss';
      banner.innerHTML=`<h2>Hedef: ${target}</h2><p>Ulaşılan: <b>${best===0?'Yok':best}</b>${best>0?` — Fark: <b>${diff}</b>`:''}</p><p style="margin-top:4px">Puan: <b>0</b></p>`;
    }

    scores[playerIdx] += pts;
    if(mode===2) roundScores[playerIdx].push(pts);

    // Sonraki adım: tek kişilik 10 soruluk modda oyuncu İLERLE ile devam eder.
    if(mode===1 && !singleMode){
      const area = document.getElementById('endBtnArea');
      area.innerHTML = '<button class="primary next-btn" id="nextQuestionBtn">İLERLE →</button>';
      area.style.display = 'flex';
      document.getElementById('nextQuestionBtn').onclick = ()=>{
        currentQ++;
        nextQuestion();
      };
    } else if(mode===1){
      // Tek soruluk hızlı denemenin mevcut otomatik bitiş akışı korunur.
      setTimeout(()=>{
        currentQ++;
        nextQuestion();
      }, 2800);
    } else {
      // İki kişilik moddaki mevcut oyuncu geçişi ve BAŞLA ekranı korunur.
      setTimeout(()=>{
        if(currentP===0){
          currentP=1; nextQuestion();
        } else {
          currentP=0; currentQ++; nextQuestion();
        }
      }, 2800);
    }
  }

  // ── KART & İŞLEM ──
  function renderCards(){
    const area = document.getElementById('cardsArea');
    area.innerHTML='';
    cards.forEach((c,i)=>{
      if(c.used) return;
      const el=document.createElement('div');
      el.className='card'+(c.isResult?' result-card':'')+(sel1===i?' selected':'')+(c.val>=10?' big-num':'');
      el.textContent=c.val;
      el.onclick=()=>G.selectCard(i);
      area.appendChild(el);
    });
  }

  function selectCard(i){
    if(cards[i].used) return;
    if(sel1===null){
      sel1=i; renderCards(); setMsg('İşlem sembolü seçin.');
    } else if(sel1===i){
      sel1=null; selOp=null; clearOps(); renderCards(); setMsg('Bir sayı seçin.');
    } else if(selOp!==null){
      doOp(sel1,i);
    } else {
      sel1=i; renderCards(); setMsg('İşlem sembolü seçin.');
    }
  }

  function selectOp(el){
    if(sel1===null){setMsg('Önce bir sayı seçin.',true);return;}
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('op-selected'));
    el.classList.add('op-selected');
    selOp=el.dataset.op;
    setMsg('İkinci sayıyı seçin.');
  }

  function doOp(i,j){
    const a=cards[i].val, b=cards[j].val;
    let res;
    const opSym={'+':'+','-':'−','*':'×','/':'÷'};
    switch(selOp){
      case '+': res=a+b; break;
      case '-': res=a-b; break;
      case '*': res=a*b; break;
      case '/': res=(b!==0&&a%b===0)?a/b:null; break;
    }
    if(res===null||!Number.isInteger(res)||res<=0){
      setMsg('Geçersiz işlem! Sonuç bir doğal sayı olmalı.',true);
      sel1=null;selOp=null;clearOps();renderCards();return;
    }
    // Geçmişe ekle
    const line=`${a} ${opSym[selOp]} ${b} = ${res}`;
    history.push(line);
    const hl=document.getElementById('historyList');
    const item=document.createElement('div');item.className='history-item';
    item.innerHTML=`<span>${res}</span> = ${a} ${opSym[selOp]} ${b}`;
    hl.appendChild(item);

    // Kartları güncelle
    cards[i].used=true; cards[j].used=true;
    const newId=cards.length;
    cards.push({val:res,id:newId,used:false,isResult:true});

    // En iyi sonucu takip et
    const diff=Math.abs(res-target);
    if(bestResult===null||diff<Math.abs(bestResult-target)) bestResult=res;

    sel1=null;selOp=null;clearOps();renderCards();

    if(res===target){
      setMsg('🎯 Hedefe ulaştınız!','good');
      document.getElementById('endBtnArea').style.display='none';
      setTimeout(()=>timeUp(false,...Object.values(G._timerCtx)),600);
    } else {
      const remaining=cards.filter(c=>!c.used);
      if(remaining.length<=1){
        // Tek kart kaldı, daha fazla işlem yapılamaz — otomatik bitir
        document.getElementById('endBtnArea').style.display='none';
        setMsg('Tüm sayılar kullanıldı.');
        setTimeout(()=>timeUp(false,...Object.values(G._timerCtx)),800);
      } else {
        setMsg('Devam edin veya süreyi bitirin.');
      }
    }
  }

  function clearOps(){
    document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('op-selected'));
    selOp=null;
  }

  // ── SKOR BAR ──
  function updateScorebar(activeP){
    const sb=document.getElementById('scorebar');
    sb.innerHTML='';
    players.forEach((name,i)=>{
      const div=document.createElement('div');
      div.className='sbox'+(i===activeP?' active-player':'');
      div.innerHTML=`<div class="sname">${name}</div><div class="sscore">${scores[i]}</div>`;
      sb.appendChild(div);
    });
  }

  function showEnd(){
    const fs=document.getElementById('finalScores');
    fs.innerHTML='';
    if(mode===1){
      const div=document.createElement('div');
      div.className='final-row winner';
      const detail = singleMode ? '1 soruluk hızlı deneme tamamlandı' : '10 soruluk yarışma tamamlandı';
      div.innerHTML=`
        <div>
          <div class="final-name">${players[0]}</div>
          <div class="final-detail">${detail}</div>
        </div>
        <div class="final-score">${scores[0]} puan</div>`;
      fs.appendChild(div);
    } else {
      const sorted=[0,1].map(i=>({name:players[i],score:scores[i],idx:i,rounds:roundScores[i]}))
        .sort((a,b)=>b.score-a.score);
      const maxScore=sorted[0].score;
      sorted.forEach((p,rank)=>{
        const isWinner=p.score===maxScore;
        const div=document.createElement('div');
        div.className='final-row'+(isWinner?' winner':'');
        div.innerHTML=`
          <div>
            <div class="final-name">${rank===0?'🏆 ':''}${p.name}</div>
            <div class="final-detail">Turlar: ${p.rounds.join(', ')}</div>
          </div>
          <div class="final-score">${p.score} puan</div>`;
        fs.appendChild(div);
      });
      if(sorted[0].score===sorted[1].score){
        const tie=document.createElement('div');
        tie.style.cssText='text-align:center;font-size:12px;color:rgba(247,242,232,0.4);padding:4px';
        tie.textContent='Berabere!';
        fs.appendChild(tie);
      }
    }
    showScreen('scEnd');
  }

  function setMsg(t, type){
    const el=document.getElementById('gameMsg');
    el.textContent=t;
    el.className='msg'+(type===true?' warn':type==='good'?' good':'');
  }

  return {showScreen,selectMode,startGame,selectCard,selectOp,timeUp,_currentPuzzle:null,_timerCtx:{}};
})();
</script>

       style="height:32px;opacity:0.35;filter:brightness(1.3);transition:opacity .3s;pointer-events:auto"
       onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='0.35'">
